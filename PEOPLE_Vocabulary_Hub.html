<style>
  :root{
    --orange:#d76b34; --sage:#7f9a76; --cream:#f1efe7; --paper:#ffffff; --ink:#232321;
    --muted:#6f6e66; --line:#e7e3d7; --pink:#e05a86; --blue:#3f7ad6; --green:#2fa564;
    --shadow:0 1px 2px rgba(30,28,22,.04),0 6px 20px rgba(30,28,22,.06);
    --shadow-lg:0 4px 30px rgba(30,28,22,.10);
    --fh:'Fraunces',Georgia,serif; --fb:'Inter',system-ui,-apple-system,sans-serif; --rad:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--fb);background:var(--cream);color:var(--ink);line-height:1.6;
    font-size:15px;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--fh);margin:0;line-height:1.2;font-weight:600;letter-spacing:-.01em}
  header.top{background:radial-gradient(120% 140% at 0% 0%,#33322d 0%,#1f1e1b 55%,#191814 100%);
    color:#fff;padding:20px 28px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-70px;width:280px;height:280px;
    background:radial-gradient(circle,rgba(215,107,52,.30),transparent 70%);pointer-events:none}
  header .paradigm{font-family:var(--fh);font-weight:600;font-size:15px;letter-spacing:6px;text-transform:uppercase;
    border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:10px;margin-bottom:12px}
  header .brand{font-size:12px;letter-spacing:4px;color:#e7a173;font-weight:700}
  header h1{font-size:30px;margin:3px 0 5px}
  header p{margin:0;color:#d3d0c6;font-size:13.5px}
  nav.tabs{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:9px 14px;
    box-shadow:0 2px 14px rgba(30,28,22,.05)}
  nav.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);
    padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13.5px;white-space:nowrap;transition:.15s}
  nav.tabs button:hover{background:var(--cream);color:var(--ink)}
  nav.tabs button.active{background:var(--ink);color:#fff}
  nav.tabs button .l{font-family:var(--fh);font-weight:700;margin-right:6px;color:var(--orange)}
  nav.tabs button.active .l{color:#ffb47f}
  main{max-width:1120px;margin:0 auto;padding:22px 20px 90px}
  .searchbar{margin:0 0 18px;position:relative}
  .searchbar input{width:100%;padding:13px 16px 13px 46px;border:1px solid var(--line);border-radius:12px;
    font:inherit;font-size:15px;background:var(--paper);box-shadow:var(--shadow)}
  .searchbar input:focus{outline:none;border-color:var(--orange)}
  .searchbar .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.5}
  .modhead{display:flex;align-items:center;gap:16px;margin:6px 0 18px}
  .modhead .badge{width:58px;height:58px;border-radius:15px;background:linear-gradient(150deg,var(--orange),#c05a26);
    color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:26px;font-weight:700;
    box-shadow:0 6px 16px rgba(199,90,40,.28);flex-shrink:0}
  .modhead h2{font-size:26px}
  .modhead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
  .sub{font-family:var(--fh);font-size:14px;font-weight:600;color:#8a5a2c;display:flex;align-items:center;gap:9px;margin:22px 0 12px}
  .sub::before{content:"";width:22px;height:3px;background:var(--orange);border-radius:2px}
  .sub .cnt{font-family:var(--fb);font-weight:600;font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
  .card{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:var(--paper);
    box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .card .w{font-family:var(--fh);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
  .card .spk{margin-left:auto;border:1px solid var(--line);background:var(--cream);border-radius:8px;
    cursor:pointer;font-size:14px;padding:2px 9px;color:var(--muted)}
  .card .spk:hover{border-color:var(--orange);color:var(--orange)}
  .card .vi{color:var(--orange);font-size:13.6px;margin-top:5px;font-weight:600}
  .card .ex{color:var(--muted);font-size:13px;margin-top:5px;font-style:italic;border-left:3px solid var(--line);padding-left:9px}
  .card .ex b{color:var(--ink);font-style:normal}
  .empty{text-align:center;color:var(--muted);padding:50px 0;font-size:15px}
  /* quiz */
  .quizwrap{max-width:620px;margin:0 auto}
  .qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);padding:24px;box-shadow:var(--shadow);text-align:center}
  .qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--muted);font-size:13px}
  .qtop .score{color:var(--green)}
  .qprompt-label{font-weight:800;letter-spacing:.5px;color:var(--orange);font-size:13px;text-transform:uppercase;margin-top:12px}
  .qprompt{font-family:var(--fh);font-size:34px;font-weight:700;margin:8px 0 22px}
  .qopts{display:flex;flex-direction:column;gap:12px}
  .qopts button{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:16px;font:inherit;
    font-weight:600;font-size:18px;cursor:pointer;transition:.12s;text-align:left;display:flex;align-items:center;gap:12px}
  .qopts button:hover{border-color:var(--sage)}
  .qopts button .k{width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:var(--cream);color:var(--orange);
    display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700}
  .qopts button.correct{background:#e4f6ea;border-color:var(--green)}
  .qopts button.correct .k{background:var(--green);color:#fff}
  .qopts button.wrong{background:#fbe4e4;border-color:#e05a5a}
  .qopts button.wrong .k{background:#e05a5a;color:#fff}
  .qopts button:disabled{cursor:default}
  .qctrl{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .btn{border:0;border-radius:11px;font:inherit;font-weight:700;font-size:14px;padding:11px 18px;cursor:pointer}
  .btn.p{background:var(--orange);color:#fff}
  .btn.g{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
  select{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-weight:600}
  .qreveal{margin-top:16px;font-size:14px;color:var(--muted);min-height:24px}
  .qreveal b{color:var(--ink)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.qprompt{font-size:28px}}
</style>
</head>

ith a partner"}, {"w": "separation", "vi": "ly thân", "ex": "a temporary separation"}, {"w": "annulment", "vi": "tuyên bố hôn nhân vô hiệu", "ex": "seek an annulment"}]}, {"name": "Wedding & Marriage", "words": [{"w": "venue", "vi": "địa điểm tổ chức", "ex": "choose a wedding venue"}, {"w": "officiant", "vi": "người chủ trì lễ cưới", "ex": "the wedding officiant"}, {"w": "best man", "vi": "phù rể chính", "ex": "the groom's best man"}, {"w": "maid of honour", "vi": "phù dâu chính", "ex": "ask her to be maid of honour"}, {"w": "bridesmaid", "vi": "phù dâu", "ex": "four bridesmaids in pink dresses"}, {"w": "groomsman", "vi": "phù rể", "ex": "three groomsmen at the altar"}, {"w": "bridal party", "vi": "đoàn cưới", "ex": "the entire bridal party"}, {"w": "reception", "vi": "tiệc cưới (sau lễ)", "ex": "hold a reception at a hotel"}, {"w": "toast", "vi": "nâng ly chúc mừng", "ex": "give a toast at the wedding"}, {"w": "exchange rings", "vi": "trao nhẫn cưới", "ex": "exchange rings at the altar"}, {"w": "bouquet", "vi": "bó hoa cô dâu", "ex": "toss the bouquet"}, {"w": "aisle", "vi": "lối đi giữa lễ đường", "ex": "walk down the aisle"}, {"w": "altar", "vi": "bàn thờ, nơi làm lễ", "ex": "stand at the altar"}, {"w": "rehearsal dinner", "vi": "bữa tối diễn tập", "ex": "attend the rehearsal dinner"}, {"w": "bridal shower", "vi": "tiệc mừng cô dâu", "ex": "throw a bridal shower"}, {"w": "wedding cake", "vi": "bánh cưới", "ex": "cut the wedding cake together"}, {"w": "anniversary", "vi": "ngày kỷ niệm hôn nhân", "ex": "celebrate their 10th anniversary"}, {"w": "prenuptial agreement", "vi": "hợp đồng tiền hôn nhân", "ex": "sign a prenuptial agreement"}, {"w": "dowry", "vi": "của hồi môn", "ex": "traditional dowry customs"}]}, {"name": "Conflict & Resolution", "words": [{"w": "fall out with", "vi": "cãi nhau, bất hòa với ai", "ex": "fall out with a friend"}, {"w": "patch things up", "vi": "làm lành, giải quyết mâu thuẫn", "ex": "patch things up"}, {"w": "clear the air", "vi": "giải tỏa hiểu lầm", "ex": "clear the air"}, {"w": "give sb the silent treatment", "vi": "im lặng trừng phạt ai", "ex": "the silent treatment"}, {"w": "bury the hatchet", "vi": "bỏ qua hiềm khích, làm hòa", "ex": "bury the hatchet"}, {"w": "come to blows", "vi": "xung đột gay gắt", "ex": "almost came to blows"}, {"w": "hold a grudge", "vi": "ôm lòng oán giận", "ex": "hold a grudge for years"}, {"w": "make amends", "vi": "bù đắp lỗi lầm", "ex": "make amends"}, {"w": "talk it out", "vi": "nói chuyện để giải quyết", "ex": "talk it out"}, {"w": "meet halfway", "vi": "nhượng bộ, gặp ở điểm chung", "ex": "meet each other halfway"}, {"w": "misunderstanding", "vi": "sự hiểu lầm", "ex": "clear up a misunderstanding"}, {"w": "conflict resolution", "vi": "giải quyết xung đột", "ex": "conflict resolution skills"}, {"w": "apologise sincerely", "vi": "xin lỗi thật lòng", "ex": "apologise sincerely"}, {"w": "forgive and forget", "vi": "tha thứ và quên đi", "ex": "forgive and forget"}, {"w": "seek common ground", "vi": "tìm điểm chung", "ex": "seek common ground"}]}]}];

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let TOTAL=0; DATA.forEach(m=>m.groups.forEach(g=>TOTAL+=g.words.length));
$('headsub').textContent = `${TOTAL} từ vựng · ${DATA.length} module · Me & My Family`;
$('foot').innerHTML = 'POLARIS Unit 1 · People — adapted from HUONG STELLA extended vocabulary. Bấm 🔊 để nghe phát âm (giọng Anh–Anh).';

/* ---- British voice ---- */
let voice=null;
function pick(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const pref=["Google UK English Female","Microsoft Sonia Online (Natural) - English (United Kingdom)","Microsoft Libby Online (Natural) - English (United Kingdom)","Kate","Serena","Daniel"];
  for(const n of pref){const v=vs.find(x=>x.name===n);if(v)return v;}
  return vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/United Kingdom/i.test(v.name))||null;}
if('speechSynthesis' in window){voice=pick();speechSynthesis.onvoiceschanged=()=>{voice=pick();};}
function say(w){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(w);
  u.lang='en-GB';u.rate=.9;u.pitch=1.05;if(!voice)voice=pick();if(voice)u.voice=voice;
  speechSynthesis.cancel();speechSynthesis.speak(u);}

/* ---- tabs ---- */
const tabsEl=$('tabs'), mainEl=$('main');
const TABS=[{id:'all',label:'🔎 Tất cả'}]
  .concat(DATA.map(m=>({id:'m'+m.letter,label:m.letter+' · '+m.title,letter:m.letter})))
  .concat([{id:'quiz',label:'🎮 Quiz'}]);
let cur='all';
function renderTabs(){
  tabsEl.innerHTML='';
  TABS.forEach(t=>{const b=document.createElement('button');b.id='tab-'+t.id;
    b.innerHTML = t.letter?`<span class="l">${t.letter}</span>${esc(t.label.split('· ')[1]||t.label)}`:t.label;
    b.onclick=()=>show(t.id);tabsEl.appendChild(b);});
  const a=$('tab-'+cur); if(a)a.classList.add('active');
}
function show(id){cur=id;
  tabsEl.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  const a=$('tab-'+id);if(a)a.classList.add('active');
  if(id==='quiz') renderQuiz(); else renderList(id);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- word card ---- */
function card(e){
  return `<div class="card">
    <div class="w"><span>${esc(e.w)}</span>
      <button class="spk" title="Nghe" onclick="say('${e.w.replace(/'/g,"\\'")}')">🔊</button></div>
    <div class="vi">${esc(e.vi)}</div>
    <div class="ex">e.g. ${esc(e.ex)}</div></div>`;
}
function groupHTML(g){
  return `<div class="sub">${esc(g.name)} <span class="cnt">· ${g.words.length}</span></div>
    <div class="grid">${g.words.map(card).join('')}</div>`;
}

/* ---- list / search views ---- */
function renderList(id){
  let out='';
  if(id==='all'){
    out=`<div class="searchbar"><span class="ic">🔎</span>
      <input id="q" placeholder="Tìm từ, nghĩa hoặc ví dụ… (VD: mother-in-law, hào phóng)" oninput="filter(this.value)"></div>
      <div id="results"></div>`;
    mainEl.innerHTML=out; renderAll(''); setTimeout(()=>$('q')&&$('q').focus(),50); return;
  }
  const m=DATA.find(x=>'m'+x.letter===id);
  out=`<div class="modhead"><div class="badge">${m.letter}</div>
      <div><h2>${esc(m.title)}</h2><p>${esc(m.sub)}</p></div></div>`;
  out+=m.groups.map(groupHTML).join('');
  mainEl.innerHTML=out;
}
function renderAll(q){
  q=(q||'').toLowerCase().trim();
  const box=$('results'); if(!box)return;
  let html='', shown=0;
  DATA.forEach(m=>{
    let inner='';
    m.groups.forEach(g=>{
      const ws=g.words.filter(e=>!q || (e.w+' '+e.vi+' '+e.ex).toLowerCase().includes(q));
      if(ws.length){ shown+=ws.length;
        inner+=`<div class="sub">${esc(g.name)} <span class="cnt">· ${ws.length}</span></div>
          <div class="grid">${ws.map(card).join('')}</div>`; }
    });
    if(inner) html+=`<div class="modhead" style="margin-top:24px"><div class="badge">${m.letter}</div>
        <div><h2>${esc(m.title)}</h2></div></div>`+inner;
  });
  box.innerHTML = shown? html : `<div class="empty">Không tìm thấy từ nào cho “${esc(q)}”.</div>`;
}
function filter(v){ renderAll(v); }

/* ---- quiz (Vietnamese meaning -> English word) ---- */
const ALLWORDS=[]; DATA.forEach(m=>m.groups.forEach(g=>g.words.forEach(w=>ALLWORDS.push(Object.assign({topic:m.title},w)))));
let quiz={pool:[],i:0,score:0,answered:false};
function renderQuiz(){
  mainEl.innerHTML=`<div class="quizwrap">
    <div class="qctrl" style="justify-content:center;margin:0 0 16px">
      <select id="qscope"><option value="all">Tất cả module</option>${DATA.map(m=>`<option value="m${m.letter}">${m.letter} · ${esc(m.title)}</option>`).join('')}</select>
      <button class="btn p" onclick="startQuiz()">Bắt đầu / Làm lại</button>
    </div>
    <div id="qbody"></div></div>`;
  startQuiz();
}
function startQuiz(){
  const sc=$('qscope').value;
  let pool = sc==='all'?ALLWORDS.slice():ALLWORDS.filter(w=>{const m=DATA.find(x=>'m'+x.letter===sc);return m && m.title===w.topic;});
  pool=pool.sort(()=>Math.random()-.5).slice(0,10);
  quiz={pool,i:0,score:0,answered:false};
  drawQ();
}
function drawQ(){
  const body=$('qbody'); const q=quiz.pool[quiz.i];
  if(!q){ body.innerHTML=`<div class="qcard"><div class="qprompt-label">Kết quả</div>
    <div class="qprompt">${quiz.score}/${quiz.pool.length}</div>
    <div class="qctrl"><button class="btn p" onclick="startQuiz()">↻ Làm lại</button></div></div>`; return; }
  const others=ALLWORDS.filter(w=>w.w!==q.w).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.w);
  const opts=[q.w,...others].sort(()=>Math.random()-.5);
  quiz.answered=false;
  body.innerHTML=`<div class="qcard">
    <div class="qtop"><span>Câu ${quiz.i+1}/${quiz.pool.length}</span><span class="score">⭐ ${quiz.score}</span></div>
    <div class="qprompt-label">How do you say it in English?</div>
    <div class="qprompt">${esc(q.vi)}</div>
    <div class="qopts" id="qopts">${opts.map((o,i)=>`<button data-o="${encodeURIComponent(o)}" onclick="answer(this)">
        <span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="qreveal" id="qreveal"></div>
    <div class="qctrl"><button class="btn g" id="qnext" onclick="nextQ()" style="display:none">Câu tiếp →</button></div>
  </div>`;
}
function answer(btn){
  if(quiz.answered)return; quiz.answered=true;
  const q=quiz.pool[quiz.i]; const chosen=decodeURIComponent(btn.dataset.o);
  document.querySelectorAll('#qopts button').forEach(b=>{
    const o=decodeURIComponent(b.dataset.o); b.disabled=true;
    if(o===q.w)b.classList.add('correct'); else if(o===chosen)b.classList.add('wrong');
  });
  if(chosen===q.w)quiz.score++;
  say(q.w);
  $('qreveal').innerHTML=`<b>${esc(q.w)}</b> — ${esc(q.ex)}`;
  $('qnext').style.display='inline-block';
}
function nextQ(){ quiz.i++; drawQ(); }

renderTabs(); show('all');
</script>
