<script>

var PRACTICES = [{"id": 1, "title": "Adolescence", "source": "Solutions Intermediate - Unit 1", "type": "insertion", "topic": "Growing up and family relationships", "skill_name": "Sentence insertion", "skill_tips": ["Read the whole text first to understand the general meaning.", "Look at the sentence before AND after each gap - both give clues.", "Check for linking words (however, but, now, also) that connect ideas.", "Make sure the inserted sentence fits grammatically and logically.", "Use the extra sentences as a check: they should NOT fit any gap."], "vocab": [{"word": "adolescence (n)", "definition": "the period of development between childhood and adulthood (roughly ages 10-19)", "forms": "adolescent (adj / n)"}, {"word": "resent (v)", "definition": "to feel angry or upset about something you think is unfair", "forms": "resentment (n) · resentful (adj) · resentfully (adv)"}, {"word": "boundaries (n pl)", "definition": "limits that define acceptable behaviour", "forms": "boundary (n sing.) · bound (v) · boundless (adj)"}, {"word": "independent (adj)", "definition": "able to think and act for yourself without needing help from others", "forms": "independence (n) · independently (adv) · depend (v)"}, {"word": "transform (v)", "definition": "to change completely in form or character", "forms": "transformation (n) · transformative (adj) · transformed (adj)"}, {"word": "dependent (adj)", "definition": "needing someone or something to survive or succeed", "forms": "dependence (n) · depend (v) · independence (n)"}, {"word": "value (v)", "definition": "to consider something important and worthwhile", "forms": "value (n) · valuable (adj) · valuably (adv)"}, {"word": "point of view (n phr)", "definition": "a particular way of thinking about or judging a situation", "forms": "viewpoint (n) · perspective (n) · opinion (n)"}], "intro": "Read the article. Match sentences A-G with gaps 1-5 in the text. There are two extra sentences.", "passage": "<p class=\"rp\"><strong>How to handle your parents</strong></p><p class=\"rp\">Parents get a lot of advice on how to handle their adolescent children, but what about some advice for teenagers on how to deal with <em>their</em> parents? Psychologist Raymond Freedman offers some tips.</p><p class=\"rp\">What is adolescence? It starts when you are aged between about ten and thirteen and is a period of rapid physical change which transforms you from a pre-teen child, dependent on your parents, to the independent young adult that you become in your early twenties.&nbsp;<span class=\"gm\">[1]</span>&nbsp;Here are some of the most common social and emotional changes that happen during adolescence.</p><p class=\"rp\"><strong>FREEDOM</strong>&nbsp;You may not want to spend as much time with your parents as you used to. You want more freedom to choose who you see and when. You may feel that your friends are as important to you as your family.</p><p class=\"rp\"><strong>PRIVACY</strong>&nbsp;You used to be most happy in the company of your parents.&nbsp;<span class=\"gm\">[2]</span>&nbsp;You need your own space and some privacy.</p><p class=\"rp\"><strong>INTERESTS</strong>&nbsp;You have new interests and they might include activities that your parents do not understand or think are a waste of time, such as playing computer games or chatting on the internet.</p><p class=\"rp\"><strong>DECISIONS</strong>&nbsp;In the past, your parents made most decisions for you and told you what to do.&nbsp;<span class=\"gm\">[3]</span>&nbsp;You may resent them telling you to go to bed, tidy your bedroom, or come home by ten o'clock.</p><p class=\"rp\"><strong>OPINIONS</strong>&nbsp;When you were younger, you didn't have many strong opinions.&nbsp;<span class=\"gm\">[4]</span>&nbsp;Adolescents are often idealistic and feel impatient and at odds with the adult world. You may feel that you have all the answers, while many adults don't have any!</p><p class=\"rp\">All these changes are perfectly normal, but it is important to remember that they will affect your relationship with your parents and that they may be a source of conflict and arguments. So what can you do to make life easier and make sure that you stay on good terms with your parents?</p><p class=\"rp\">Firstly, your parents will feel much better if you let them know that you still love and value them. Remember that they have lost forever the little child you once were.&nbsp;<span class=\"gm\">[5]</span></p><p class=\"rp\">Secondly, try to agree rules and boundaries. You may feel these are unnecessary, but your parents' main concern is often just to keep you safe. Once you have agreed what is and isn't acceptable behaviour, try to stick to it.</p><p class=\"rp\">Thirdly, try to understand why they might be irritated by your behaviour. Finally, it's all about communication! Keep talking to your parents, tell them about what you did today, let them know where you are going, and ask for advice if you need it.</p>", "sentences": {"A": "They may not say so, but they are probably feeling a sense of loss and may even feel rejected by you.", "B": "Your parents will expect you to behave responsibly.", "C": "But now you want to decide things for yourself and don't want to be told what to do all the time.", "D": "As your body changes, you also begin to think and feel differently.", "E": "Despite this, you should always listen carefully.", "F": "Now you are beginning to see the world differently, developing your own views and your own sense of right and wrong.", "G": "Now you probably want to spend more time on your own."}, "answers": ["D", "G", "C", "F", "A"], "extras": ["B", "E"]}, {"id": 2, "title": "Field Games", "source": "Solutions Intermediate - Unit 2", "type": "mcq", "topic": "Outdoor activities and adventure", "skill_name": "Multiple choice (4 options)", "skill_tips": ["Read the question carefully - identify exactly what is being asked.", "Read all four options before choosing - don't stop at the first plausible answer.", "Eliminate obviously wrong answers first to narrow down your choice.", "Watch for distractors: options that mention words from the text but in the wrong context.", "Questions usually follow the order of the text - use this to locate the relevant paragraph."], "vocab": [{"word": "co-ordinates (n pl)", "definition": "a set of numbers that identify a precise location on a map or GPS", "forms": "co-ordinate (v / n sing.) · co-ordination (n) · co-ordinated (adj)"}, {"word": "waterproof (adj)", "definition": "not allowing water to pass through", "forms": "waterproof (v) · waterproofing (n) · waterproofed (adj)"}, {"word": "logbook (n)", "definition": "a book used to record events or findings", "forms": "log (v / n) · logging (n) · logged (adj)"}, {"word": "letterboxing (n)", "definition": "a traditional British outdoor activity using maps to find hidden boxes", "forms": "letterbox (n / v) · letterboxer (n)"}, {"word": "cache (n)", "definition": "a hidden store of things (in geocaching, the hidden container)", "forms": "cache (v) · cached (adj)"}, {"word": "participants (n pl)", "definition": "people who take part in an activity or event", "forms": "participant (n sing.) · participate (v) · participation (n)"}, {"word": "strenuous (adj)", "definition": "requiring a lot of physical effort", "forms": "strenuously (adv) · strenuousness (n)"}, {"word": "high-tech (adj)", "definition": "using the most modern and advanced technology", "forms": "technology (n) · technological (adj) · technologically (adv)"}], "intro": "Read the blog post. Choose the correct options (a-d).", "passage": "<p class=\"rp\"><strong>GPS CHALLENGE – CLAUDIA'S BLOG</strong></p><p class=\"rp\">One of my favourite hobbies is geocaching. It's a kind of treasure-hunting game that uses a GPS device – usually your smartphone – to find small containers called geocaches. People usually start by looking for geocaches close to their home and then gradually go further afield.</p><p class=\"rp\">Geocaching is quite a new game: it began around the year 2000. However, similar games did exist in the past. For example, in the middle of the 19th century, a game called 'letterboxing' became popular in the south of England. But geocaching is now played all over the world – on all 7 continents, including Antarctica!</p><p class=\"rp\">To take part in geocaching, you need a mobile phone with GPS. You go to the geocaching website or download the app, choose a geocache and start looking. When you find it, you sign the logbook inside. Many geocaches also contain a small toy or gift. You are welcome to take this, provided you replace it with something you have brought with you.</p><p class=\"rp\">There are lots of interesting variations. There are multi-cache challenges, where you have to find a series of geocaches to get the next clue. There are travelling geocaches, which move from place to place. There are also webcam geocaches, where you take a photo of yourself with a public webcam. Personally, I've enjoyed the multi-cache challenges the most.</p><p class=\"rp\">Geocaching can be done alone, with friends or at a geocaching event. Every November, for example, about 1,000 geocachers get together in Sweden for the 'Fumble after Dark' event. They listen to talks in the afternoon and then go outside into the darkness for night-time adventures. It sounds amazing – and I'm seriously thinking about going next year!</p>", "questions": [{"q": "To take part in geocaching you need", "opts": ["a mobile phone with GPS", "a mobile phone with GPS and a toy or gift", "a mobile phone, a toy or gift and a logbook", "nothing – just yourself!"]}, {"q": "The activity of geocaching", "opts": ["began in the 19th century, but only became popular after 2000", "was originally only popular in one region of England, but now has fans all over the world", "was called 'letterboxing' when it was first invented", "has similarities with a 19th-century game"]}, {"q": "When you find a gift in a geocache, you", "opts": ["make a note of the gift on the website", "can borrow the gift, but have to return it", "are allowed to take the gift if you replace it with something else", "take a photo of the gift as proof that you have found it"]}, {"q": "The writer thinks that the most enjoyable kind of geocaching is when", "opts": ["you have to find a public webcam", "you have to find a series of geocaches", "you have to find a geocache and then hide it in a different location", "you simply have to find one geocache"]}, {"q": "The writer believes the 'Fumble after Dark' event", "opts": ["is less fun than geocaching with a couple of friends", "would be a very enjoyable event to attend", "is only suitable for adventurous people", "needs to attract more people"]}, {"q": "The writer has written the blog mainly to", "opts": ["suggest that people try geocaching", "explain the differences between letterboxing and geocaching", "publicise a geocaching event in Sweden", "warn the reader that geocaching is addictive"]}], "answers": ["a", "d", "c", "b", "b", "a"]}, {"id": 3, "title": "Body Clock", "source": "Solutions Intermediate - Unit 3", "type": "para_match", "topic": "Health, science and the human body", "skill_name": "Paragraph matching", "skill_tips": ["Skim all paragraphs first to understand what each one is about.", "Identify the key theme or time period of each paragraph.", "Some paragraphs will match more than one question - this is normal.", "Focus on the specific detail asked in each question.", "Cross-reference your answers: if a paragraph matches two questions, make sure both fit perfectly."], "vocab": [{"word": "melatonin (n)", "definition": "a hormone produced by the body that regulates sleep and wakefulness", "forms": "(scientific term — no common word family)"}, {"word": "cognitive (adj)", "definition": "relating to mental processes such as thinking, memory and learning", "forms": "cognition (n) · cognitively (adv)"}, {"word": "siesta (n)", "definition": "a short sleep or rest taken in the early afternoon, common in hot countries", "forms": "(from Spanish — no common English word family)"}, {"word": "strenuous (adj)", "definition": "requiring great physical effort", "forms": "strenuously (adv) · strenuousness (n)"}, {"word": "immune system (n phr)", "definition": "the body's natural defence system against illness and infection", "forms": "immune (adj) · immunity (n) · immunise (v)"}, {"word": "alertness (n)", "definition": "the state of being watchful and ready to respond quickly", "forms": "alert (adj / v) · alertly (adv)"}, {"word": "suppress (v)", "definition": "to prevent something from happening or being expressed", "forms": "suppression (n) · suppressive (adj) · suppressed (adj)"}, {"word": "peak (v)", "definition": "to reach the highest point or level", "forms": "peak (n / adj) · peaked (adj)"}], "intro": "Match the paragraphs (A-H) with questions 1-10 below. Some paragraphs match more than one question.", "passage_label": "In which period of the day...", "passage": "<p class=\"rp\"><strong>Night and Day</strong></p><p class=\"rp\"><strong>A&nbsp; 6 AM – 9 AM</strong>&nbsp;Your body is waking up. It stops producing melatonin, the hormone which makes you feel sleepy. Blood vessels are stiffer and less flexible. Your blood is thicker and stickier and your blood pressure is at its highest, so it's not the best time to exercise.</p><p class=\"rp\"><strong>B&nbsp; 9 AM – 12 PM</strong>&nbsp;You're at your most alert at this time in the morning. Tests show that short-term memory is at its best right now. It's a good time to get a lot of work done, because you'll experience a big dip after lunch.</p><p class=\"rp\"><strong>C&nbsp; 12 PM – 3 PM</strong>&nbsp;Your stomach is full and working hard after lunch. You become much less alert and probably feel a bit sleepy. More road accidents happen at this time of day than any other, particularly involving older people.</p><p class=\"rp\"><strong>D&nbsp; 3 PM – 6 PM</strong>&nbsp;This is a very good time to exercise. Body temperature increases in the late afternoon. Your heart and lungs work better and muscles are six per cent stronger than at their lowest point in the day. Some sportspeople believe that if you try to break a world record at this time of day, you'll have a greater chance of success.</p><p class=\"rp\"><strong>E&nbsp; 6 PM – 9 PM</strong>&nbsp;By now you'll be getting hungry. But don't eat too late! In the evening, our bodies struggle to digest fats and sugars. Studies show that people will lose more weight if they have their main meal at lunchtime rather than in the evening.</p><p class=\"rp\"><strong>F&nbsp; 9 PM – 12 AM</strong>&nbsp;It's getting near to bedtime. Your body temperature is falling and your body clock is telling you that it's time for bed. Your body is producing lots of melatonin to help you go to sleep. Blue light from mobile phones, computer screens and flat-screen TVs is particularly effective at keeping us awake. So turn off those gadgets!</p><p class=\"rp\"><strong>G&nbsp; 12 AM – 3 AM</strong>&nbsp;Your body really wants to be asleep. Melatonin reaches its maximum level. Your stomach has stopped working and your brain is at rest. If you stay awake much longer, your powers of concentration will decrease sharply.</p><p class=\"rp\"><strong>H&nbsp; 3 AM – 6 AM</strong>&nbsp;Melatonin levels are still high, and you are in deep sleep. Your body temperature is much cooler than at any other time of the day. As dawn approaches, your melatonin levels will decrease and your body will prepare to wake up.</p>", "questions": ["do you completely stop digesting food?", "is it best to be physically active?", "do our bodies have difficulty digesting certain foods?", "are older people more likely to have accidents?", "does your body contain the most melatonin?", "are you best at remembering things over short periods of time?", "are you at your strongest physically?", "does your body stop making melatonin?", "is your body at its coolest?", "does your body begin to become cooler?"], "answers": ["G", "D", "E", "C", "G", "B", "D", "A", "H", "F"], "note": "Two of the paragraphs match more than one question."}, {"id": 4, "title": "Alternative Living", "source": "Solutions Intermediate - Unit 4", "type": "text_match", "topic": "Housing, environment and sustainability", "skill_name": "Matching statements to texts", "skill_tips": ["Read all the short texts quickly first to understand each one's main idea.", "Underline the key noun in each statement (e.g. 'recycled materials', 'energy self-sufficient').", "Search for that key idea in the texts - it may be expressed in different words (paraphrasing).", "Some texts match two statements - keep this in mind and don't stop after one match.", "Check every answer: re-read the matched paragraph to confirm your choice."], "vocab": [{"word": "sculptor (n)", "definition": "an artist who creates three-dimensional works of art", "forms": "sculpt (v) · sculpture (n) · sculptural (adj)"}, {"word": "insulate (v)", "definition": "to cover something to prevent heat, cold or sound from passing through", "forms": "insulation (n) · insulated (adj) · insulator (n)"}, {"word": "self-sufficient (adj)", "definition": "able to produce everything you need without outside help", "forms": "self-sufficiency (n) · suffice (v) · sufficient (adj) · sufficiently (adv)"}, {"word": "stackable (adj)", "definition": "designed so that one can be placed on top of another", "forms": "stack (v / n) · stacked (adj)"}, {"word": "recycled (adj)", "definition": "converted from waste into reusable material", "forms": "recycle (v) · recycling (n) · recyclable (adj)"}, {"word": "philosopher (n)", "definition": "a person who studies or develops theories about the nature of existence and knowledge", "forms": "philosophy (n) · philosophical (adj) · philosophically (adv)"}, {"word": "solar panel (n phr)", "definition": "a device that converts sunlight into electricity", "forms": "solar (adj) · panel (n) · photovoltaic (adj)"}, {"word": "convert (v)", "definition": "to change from one use or purpose to another", "forms": "conversion (n) · converted (adj) · convertible (adj)"}], "intro": "Read the texts (A-D). Match them with statements 1-7 below. Two texts match with two statements each.", "passage": "<p class=\"rp\"><strong>A&nbsp; Living sculptures</strong></p><p class=\"rp\">Gregory Kloehn is a sculptor with a difference. Not only are his sculptures created from bits of rubbish, but each of his unique creations offers a homeless person somewhere to live. Gregory works in California, where there are a lot of people living on the streets. Each of his sculptures is no bigger than the average sofa, but the tiny, one-roomed shelters are as wonderful as mansions for a person who is sleeping rough. Gregory searches on rubbish dumps to find pieces to use. A washing machine door is as good as a normal window. A fridge door can make a fine front door, and has useful shelves on the inside. And each home is on wheels so that it can be pushed around easily.</p><p class=\"rp\"><strong>B&nbsp; Build your own tiny home</strong></p><p class=\"rp\">If you wanted your own house, would you build it yourself? Some Americans are now building miniature homes for themselves in order to live more cheaply and in a more ecological way than usual. And with wheels on their home, they can go anywhere! Part of the fun is making it yourself – even if you don't know how. 'Most people who are interested in tiny houses don't have any building experience,' says Ryan Mitchell, founder of TheTinyLife.com website, who organises conferences for interested people. One of the conference speakers is Dee Williams, who has been living in her cosy wooden home since 2004. Now you can find thousands of instructional videos on YouTube, if you want to make your own!</p><p class=\"rp\"><strong>C&nbsp; The designer micro-house</strong></p><p class=\"rp\">Italian architect Renzo Piano is famous for designing Europe's tallest skyscraper, the Shard in London. Now he has gone to the other extreme: he's designed the smallest house possible. It's just two and a half by three metres and can be carried on a lorry. It's really energy-efficient, with solar panels on the roof and a container to collect rainwater, so the house is incredibly cheap to run. The house is called 'Diogene', named after the Greek philosopher Diogenes who rejected luxury by living in a large ceramic jar! The Diogene is currently on display in Germany. And at just £17,000, this designer house isn't as expensive as many family cars.</p><p class=\"rp\"><strong>D&nbsp; Well-contained housing</strong></p><p class=\"rp\">If you heard that they were putting homeless people into shipping containers, you might be shocked. But that's exactly what is happening in Brighton, England. The Brighton Housing Trust has been inspired by a similar housing estate in the Netherlands. It is developing 36 studio flats in the town centre, using old shipping containers. At 24 square metres, they are smaller than a shared room in a homeless hostel, but they are much more desirable and certainly spacious enough for one person. They are also stackable – the containers will sit on top of one another with stairs connecting them.</p>", "statements": ["There is information on the internet to show people how to build these homes.", "The builder of these homes uses only recycled materials.", "The builder of these homes was inspired by a historical figure.", "The designer gives practical help to people who want to build homes like these.", "These homes are powered by renewable energy.", "These homes can be found in two European countries.", "These homes can be put together to make a block of flats."], "answers": ["B", "A", "C", "B", "C", "D", "D"], "options": ["A", "B", "C", "D"]}, {"id": 5, "title": "Clever Machines", "source": "Solutions Intermediate - Unit 5", "type": "mcq", "topic": "Technology and artificial intelligence", "skill_name": "Multiple choice (detailed comprehension)", "skill_tips": ["Read the whole text once without stopping, then read the questions.", "For each question, locate the relevant section of the text before choosing.", "Watch for questions about the writer's purpose or opinion - these test inference, not just facts.", "Be careful with 'NOT' questions - they ask for the false option.", "Vocabulary questions: use context clues from the surrounding sentences."], "vocab": [{"word": "artificial intelligence (n phr)", "definition": "the ability of a computer or machine to perform tasks that normally require human intelligence", "forms": "artificial (adj) · artificially (adv) · intelligent (adj) · intelligence (n)"}, {"word": "chatbot (n)", "definition": "a computer program designed to simulate conversation with human users", "forms": "chat (v / n) · bot (n)"}, {"word": "diagnose (v)", "definition": "to identify the nature of an illness or problem through examination", "forms": "diagnosis (n) · diagnostic (adj) · diagnostically (adv)"}, {"word": "mathematician (n)", "definition": "a person who studies or works in mathematics", "forms": "maths / mathematics (n) · mathematical (adj) · mathematically (adv)"}, {"word": "convince (v)", "definition": "to cause someone to believe something or to do something", "forms": "conviction (n) · convinced (adj) · convincing (adj) · convincingly (adv)"}, {"word": "intelligence (n)", "definition": "the ability to learn, understand and reason", "forms": "intelligent (adj) · intelligently (adv) · intellect (n) · intellectual (adj)"}, {"word": "simulate (v)", "definition": "to create a model or imitation of something", "forms": "simulation (n) · simulator (n) · simulated (adj)"}, {"word": "debate (n / v)", "definition": "a discussion involving different points of view on a topic", "forms": "debatable (adj) · debatably (adv) · debater (n)"}], "intro": "Read the article. Choose the correct options (a-d).", "passage": "<p class=\"rp\"><strong>Testing intelligence</strong></p><p class=\"rp\">This conversation is between a real human and a computer program called Mitsuku. Programs like Mitsuku are called 'chatbots'. Mitsuku was the winner of the Loebner Prize in 2013, an annual competition to find a program that can pass the Turing test. The test, designed to measure artificial intelligence, was invented by British mathematician Alan Turing.</p><p class=\"rp\"><strong>A:</strong> Hello. I'm Mitsuku. What's your name?<br><strong>B:</strong> Hello, Mitsuku. I'm John. Do you know what day it is today?<br><strong>A:</strong> Nice to meet you, John. Today is Tuesday, 17th June.<br><strong>B:</strong> What would you do if I called you stupid?<br><strong>A:</strong> Humans are not too intelligent at times. I would probably just ignore it.<br><strong>B:</strong> Are you a robot?<br><strong>A:</strong> No, I'm a real person just like you.</p><p class=\"rp\">Fifty or sixty years ago, computers were very simple machines, but even then scientists believed that one day machines would be able to 'think' and that they would probably be as intelligent as humans. The question was, 'How can we measure the intelligence of a machine?' Alan Turing, who had helped to break the German Enigma code during the Second World War, came up with an answer. He said we need to ask, 'Can this computer talk? Can it have a conversation like a human?' If it can, he argued, then it is intelligent and it can think. In a Turing test, judges sit at a screen and have a chatroom conversation with a chatbot program. They don't know if they are chatting with another person or with a chatbot. After exchanging messages for five minutes, the judge decides if he or she is chatting with a human or a machine.</p><p class=\"rp\">Turing predicted that by the year 2000, the average person 'will not have more than a 70% chance of making the right identification'. In other words, computers would trick the judges 30% of the time. An American called Hugh Loebner was fascinated by Turing's idea, and in the early 1990s he offered a prize of $100,000 to the creator of the first chatbot to pass the Turing test. In order to win the $100,000, a chatbot must convince at least 30% of the judges that it is human. Many chatbots have entered the competition, but so far no chatbot has won the big money prize.</p><p class=\"rp\">But is the Turing test a good way to decide if a machine is intelligent? Critics argue that the chatbots in the competition are merely imitating humans. Humans are the only animals on Earth that can speak, and that's why Turing chose to focus on it. But what is really impressive, critics say, is machines that do things that we can't do – for example, that Google can search hundreds of millions of websites for a single word in a matter of seconds. A chatbot is really nothing more than a successful liar.</p><p class=\"rp\">Fans of the Turing test, on the other hand, feel that humans are themselves machines. It's just that our brains are far more complex than computers. As philosopher and scientist Daniel Dennett said in a recent interview, 'It's not impossible to have a conscious robot. You're looking at one.'</p>", "questions": [{"q": "Around the middle of the last century, scientists", "opts": ["tried to build computers that were as intelligent as humans", "built a machine that could have a conversation with a human", "thought that computers could never be as intelligent as humans", "thought that in the future computers and people might be equally clever"]}, {"q": "According to the Turing test, a computer that could think would be able to", "opts": ["break the Enigma code", "talk to people like an ordinary person does", "chat with another computer", "have a chatroom conversation for a minimum of five minutes"]}, {"q": "Chatbots that enter the Loebner competition", "opts": ["have a 30% chance of winning", "share prize money of $100,000", "need to appear human to about a third of the judges", "will never win the big money prize"]}, {"q": "The main criticism of the Turing test is that", "opts": ["Turing focused on the wrong type of intelligence", "the winner simply has to copy human behaviour", "Google and NASA computers can also achieve amazing things", "chatbots are designed to do things that we can't do"]}, {"q": "The writer of the text", "opts": ["agrees with the critics of the Turing test", "is more impressed with search engines than chatbots", "does not express a personal opinion on the validity of the Turing test", "believes that people are just very complex robots"]}], "answers": ["d", "b", "c", "b", "c"]}, {"id": 6, "title": "#GIRLBOSS", "source": "Solutions Intermediate - Unit 6", "type": "insertion_tf", "topic": "Business, entrepreneurship and success", "skill_name": "Sentence insertion + True/False", "skill_tips": ["For insertion: read the sentence before and after each gap - both give context clues.", "Look for pronoun references (she, it, they) that must refer to something already mentioned.", "For True/False: find the exact part of the text that the statement refers to.", "False statements often change a key detail (number, name, direction) from the original.", "Don't mark something False just because it isn't mentioned - it must contradict the text."], "vocab": [{"word": "entrepreneur (n)", "definition": "a person who sets up a business, taking on financial risks in the hope of profit", "forms": "entrepreneurial (adj) · entrepreneurship (n)"}, {"word": "retailer (n)", "definition": "a business that sells goods directly to consumers", "forms": "retail (n / v / adj) · retailing (n)"}, {"word": "vintage (adj)", "definition": "of high quality from a past era; (of clothing) from a previous decade", "forms": "vintage (n) — no common verb form"}, {"word": "revenue (n)", "definition": "the income that a business receives from its activities", "forms": "revenues (n pl) — related: profit (n), income (n)"}, {"word": "profit (n)", "definition": "the financial gain made when revenue exceeds costs", "forms": "profit (v) · profitable (adj) · profitably (adv) · profitability (n)"}, {"word": "shoplifting (n)", "definition": "stealing goods from a shop", "forms": "shoplift (v) · shoplifter (n)"}, {"word": "flock (v)", "definition": "to move or gather together in large numbers", "forms": "flock (n) · flocking (n)"}, {"word": "brand (n)", "definition": "a type of product made by a particular company under a particular name", "forms": "brand (v) · branded (adj) · branding (n)"}], "intro_ins": "Read the article. Match sentences A-H with gaps 1-6 in the text. There are two extra sentences.", "intro_tf": "Read the text again. Are the sentences true (T) or false (F)? Write T or F.", "passage": "<p class=\"rp\"><strong>Rags to RICHES</strong></p><p class=\"rp\">Sophia Amoruso is the highly successful CEO of Nasty Gal, an online fashion retailer with over 550,000 customers in 150 countries. But Sophia is not your average entrepreneur and certainly nothing like the majority of CEOs that you come across in today's business world.</p><p class=\"rp\">Amoruso hated school and left home at the age of seventeen. She did a variety of boring jobs, spent a couple of years hitch-hiking around, and then got arrested for shoplifting.&nbsp;<span class=\"gm\">[1]</span>&nbsp;There, she got a job in a shoe shop, from which she was soon sacked. Her next job was on the reception desk at an art school, checking student IDs. While sitting at her computer, she spent hours visiting shopping sites such as eBay and the social networking site MySpace. She was interested in fashion and photography and thought that selling clothes on eBay might be an amusing way to make money. So she resigned from her job and bought a book called <em>Starting an eBay Business for Dummies</em>.</p><p class=\"rp\">She decided to start buying and selling vintage designer clothes – clothes that would appeal to fashion-conscious women like herself in their late teens and early twenties. Having named her eBay store 'Nasty Gal Vintage', she began visiting second-hand clothes shops and charity shops, and spent hours searching for designer clothes that other people had rejected.&nbsp;<span class=\"gm\">[2]</span>&nbsp;For example, she bought a Chanel jacket at a Salvation Army store for $8 and sold it on eBay for $1,000. She also searched for second-hand clothes online. For example, she found Yves Saint Laurent clothes by googling misspellings of the designer's name. She reasoned that anyone who couldn't spell the name probably had no idea how much the clothes were worth!</p><p class=\"rp\">Amoruso realised that people were more likely to visit her eBay shop if her clothes were worn by real people rather than photographed hanging on a door or thrown across a bed. As she explained, 'Put it on the right girl, with the right hair and the right attitude, showing people how they could wear it – that was everything.'&nbsp;<span class=\"gm\">[3]</span>&nbsp;She had hardly any money to spend on wages, so she paid them in hamburgers!</p><p class=\"rp\">In 2007, eBay suspended her account because other eBay sellers had complained about the links on her eBay page to her MySpace page, where she had also begun to sell her clothes.&nbsp;<span class=\"gm\">[4]</span>&nbsp;Customers were flocking to her MySpace page, and she had already learned all she could from her time on eBay – to respond to every customer comment and to really understand the people who were buying her clothes and what they liked about them. This has allowed her to build up a large group of incredibly loyal customers.&nbsp;<span class=\"gm\">[5]</span>&nbsp;Half of Nasty Gal's business comes from customers who are returning for a second, third or fourth visit. From a small office in Amoruso's aunt's house in 2006, Nasty Gal has moved to enormous offices and warehouses in Los Angeles with over 350 employees, 75% of whom are women.</p><p class=\"rp\">Amoruso isn't going to stop there, however.&nbsp;<span class=\"gm\">[6]</span>&nbsp;She knows how much time and effort has gone into building the business and has no time for people who think success like hers comes easily. 'A lot of people in my generation don't seem to understand that you have to work your way up,' she writes in her book #GIRLBOSS.</p>", "sentences": {"A": "So she employed her MySpace friends as models.", "B": "All the clothes she bought were very expensive and certainly would not appeal to teenagers or young women.", "C": "That is quite rare in retail stores, whether online or on the high street.", "D": "Luckily, the police didn't charge her and she moved to San Francisco.", "E": "She has big plans for Nasty Gal and is prepared to work hard for it.", "F": "She knows that her success is due in large part to luck and not to her own efforts and talents.", "G": "Occasionally, she came across something really valuable that other customers had evidently missed.", "H": "But she didn't worry about that. She had no regrets about leaving the auction site."}, "answers_ins": ["D", "G", "A", "H", "C", "E"], "extras_ins": ["B", "F"], "tf_statements": ["Amoruso resigned from the job in the shoe shop because she found it boring.", "She hoped to attract women of her own age to her eBay store.", "She found all the clothes for her eBay store by searching online.", "She found one valuable item of clothing by accidentally misspelling the designer's name.", "She couldn't afford to employ professional models.", "Amoruso thinks that many young people's expectations are too high when they first start work."], "answers_tf": ["F", "T", "F", "F", "T", "T"]}, {"id": 7, "title": "Graffiti's Softer Side", "source": "Solutions Intermediate - Unit 7", "type": "mcq", "topic": "Art, creativity and public spaces", "skill_name": "Multiple choice (attitude and opinion)", "skill_tips": ["MCQ questions follow the same order as information in the text — use this to locate answers quickly.", "The correct option matches the meaning of the text but uses different words (paraphrase).", "Check the other options are either not mentioned or contradict the text.", "Questions about the writer's overall opinion come last — think about the whole article, not just one paragraph.", "If you can't decide between options, an intelligent guess is better than no answer."], "vocab": [{"word": "irritate (v)", "definition": "to make someone feel annoyed or impatient", "forms": "irritation (n) · irritated (adj) · irritating (adj) · irritably (adv)"}, {"word": "vandalism (n)", "definition": "deliberate destruction or damage of public or private property", "forms": "vandalise (v) · vandal (n) · vandalised (adj)"}, {"word": "littering (n)", "definition": "dropping rubbish or waste in a public place", "forms": "litter (v / n) · littered (adj)"}, {"word": "temporary (adj)", "definition": "lasting for only a short time; not permanent", "forms": "temporarily (adv) — opposite: permanent (adj) / permanently (adv)"}, {"word": "amusement (n)", "definition": "the feeling of being entertained or finding something funny", "forms": "amuse (v) · amusing (adj) · amusingly (adv) · amused (adj)"}, {"word": "endangered species (n phr)", "definition": "a type of animal or plant that may soon become extinct", "forms": "endanger (v) · endangered (adj) · species (n — same in pl)"}, {"word": "feminine (adj)", "definition": "having qualities traditionally associated with women", "forms": "femininity (n) · feminism (n) · feminist (n / adj)"}, {"word": "marine life (n phr)", "definition": "living organisms that exist in the sea", "forms": "marine (adj) · maritime (adj)"}], "intro": "Read the article about yarn bombing. For questions 1–6, choose the correct answers (a–d).", "passage": "<p class=\"rp\"><strong>Granny graffiti</strong></p><p class=\"rp\">The statue of Rocky outside the Philadelphia Museum of Art is very popular with tourists, who often stop to take their photo in front of it without bothering to visit the museum itself. This irritated Jessie Hemmons, so last month the 24-year-old artist knitted a bright pink jacket and put it on the statue of the boxer. She chose the colour because it attracts attention. On the front of the jacket, Jessie has knitted the words 'Go see the art'. Jessie hopes that her message will result in more people visiting the gallery.</p><p class=\"rp\">This form of street art has become known as 'yarn bombing'.</p><p class=\"rp\">The craze is believed to have started in 2005, when Magda Sayeg was working at Raye, her shop in Houston, Texas. One day she decided, just for fun, to knit a blue-and-pink cover for the shop's door handle. She loved it, and &ndash; unexpectedly &ndash; so did her customers. Pedestrians stopped on the pavement outside the shop to photograph it, and even motorists slowed down to take a closer look. Their reaction inspired Magda to make covers for other objects in the street, such as a stop sign, a lamp post, a parking meter &ndash; and even an entire bus, which took a whole week to complete! She decided to set up a group of knitters, which she called 'Knitta Please'. Photos of their creations kept appearing on blogs and social networking sites and the craze soon spread. There are now yarn bombing groups in dozens of countries and they have covered bus stops, bicycle racks, benches, phone boxes and even fountains! Like most types of street art, the works are temporary and begin to fall apart within a few weeks, so yarn bombers photograph and film their works and upload them to the internet, where everybody can see them.</p><p class=\"rp\">Some of the men who want to have their photos taken with Rocky are disappointed when they see the jacket, but Jessie is pleased that they react that way. She believes that most street art is done by men and that yarn bombing is a more feminine activity. But not everyone approves of the new form of street art. Some people argue that if it is done without permission, then covering public objects in wool is vandalism and littering. That may be true in the eyes of the law, but the police appear to take a relatively relaxed attitude to yarn bombers. They might interrupt them if they see them at work in the street, but yarn bombers say the police are more likely to find their activities amusing than view them as criminal.</p><p class=\"rp\">However, yarn bombing has landed Polish artist Agata Oleksiak in serious trouble. Agata &ndash; or Olek, as she calls herself &ndash; has been an active artist since 2003, and has covered cars and diggers in wool, as well as a whole train in her native city of &Lstrok;&oacute;d&#378;. Her work has been shown in museums and galleries around the world. But when Olek knitted covers and attached them to sculptures in an underwater museum near Canc&uacute;n, the Mexican authorities were not very happy. Like Jessie Hemmons's jacket, Olek's covers had a political message: she wanted to draw attention to endangered species such as the whale shark. But the director of the museum claims that Olek may herself have harmed the marine life that grows on the sculptures. Olek is puzzled by the reaction. She claims that her message is a positive one and sees herself as a professional artist. She believes that her creations are as good as the paintings you see in the world's best art galleries, and if anyone calls her work 'yarn bombing', she gets quite upset.</p><p class=\"rp\">Whether you see yarn bombing as a bit of fun that brightens up drab cities, or as a form of high culture with a serious message, it is a craze that is likely to continue.</p>", "questions": [{"q": "Jessie Hemmons 'yarn bombed' the statue of Rocky because", "opts": ["she wants people to take photos of it", "she thinks too many tourists come and see it", "she wants more people to go and see the paintings in the museum", "tourists find it annoying"]}, {"q": "Why did Magda Sayeg knit a cover for the door handle of her shop?", "opts": ["for her own amusement", "to attract customers", "because someone passing the shop suggested it", "t all (v) · instalment plan (n phr)"}, {"word": "pen name / pseudonym (n)", "definition": "a made-up name an author uses instead of their real name", "forms": "pseudo- (prefix) · anonymous (adj) · anonymously (adv)"}, {"word": "word of mouth (n phr)", "definition": "information passed informally from person to person by speaking", "forms": "(fixed phrase — no inflected forms)"}, {"word": "controversial (adj)", "definition": "causing disagreement or argument among people", "forms": "controversy (n) · controversially (adv) · uncontroversial (adj)"}, {"word": "betray (v) / betrayal (n)", "definition": "to be disloyal to someone who trusts you; an act of disloyalty", "forms": "betrayer (n) · treachery (n) · treacherous (adj)"}, {"word": "evolve (v)", "definition": "to change and develop gradually over time", "forms": "evolution (n) · evolutionary (adj) · evolved (adj)"}, {"word": "dialogue (n)", "definition": "conversation between characters in a story, film, or play", "forms": "dialogic (adj) — opposite: monologue (n)"}, {"word": "literary genre (n phr)", "definition": "a category or type of literature with shared characteristics", "forms": "literature (n) · literary (adj) · genre (n)"}], "intro_ins": "Read the article. Match sentences A-H with gaps 1-6 in the text. There are two extra sentences.", "intro_tf": "Read the text again. Are the sentences true (T) or false (F)? Write T or F.", "passage": "<p class=\"rp\"><strong>A different type of phone book</strong></p><p class=\"rp\">Although books are still popular with teenagers, most of them spend more of their leisure time staring at their phone than reading a paperback. And the more versatile phones become, the more reasons young people have for looking at them.&nbsp;<span class=\"gm\">[1]</span>&nbsp;Instead of publishing a whole book at once, they produce very short chapters, which they send once a week to their readers by text message. Some even claim that this style of writing represents a new literary genre: the 'cell phone novel'.</p><p class=\"rp\">The very first cell phone novel was written in 2003 by a man in Tokyo who called himself Yoshi.&nbsp;<span class=\"gm\">[2]</span>&nbsp;It became so popular, mainly through word of mouth, that it was later published as a paperback. The book version sold 2.6 million copies and a television series, a comic book and a film were made of the story. Online companies became interested and set up websites where authors could upload their stories and readers could discuss them in forums as the stories evolved.</p><p class=\"rp\">Although the idea originated in Japan, cell phone novels have also sprung up in the rest of East Asia, Europe and Africa. Many are written by high school or university students who are very familiar with the topics that teenagers are interested in.&nbsp;<span class=\"gm\">[3]</span>&nbsp;Twenty-one-year-old Rin said that she started her novel <em>If You</em> during her final year at high school and explained that it was the tragic love story of two childhood friends.</p><p class=\"rp\">Rin wrote her novel over a six-month period in spare moments, often while commuting on the train.&nbsp;<span class=\"gm\">[4]</span>&nbsp;Readers then voted her novel the best that year and she was offered a book contract. Her book sold 400,000 copies and was number five in the Japanese bestseller list. Rin said that her mother had had no idea that she had been writing a novel and was therefore very surprised when she saw a book with her daughter's name on it.</p><p class=\"rp\">The style of cell phone novels has evolved to suit the medium. Chapters have no more than 200 words, and often just 50&ndash;100 words.&nbsp;<span class=\"gm\">[5]</span>&nbsp;The text mostly consists of dialogue and the language is direct, conveying a lot in a few words. Many cell phone novelists had never written fiction before and many of their readers have never read a normal novel. Other rules have evolved; for example, authors only have one name and that is a pseudonym or pen name.</p><p class=\"rp\">In 2009, a young Japanese writer called Takatsu, who lives in Canada, began writing the first English language cell phone novel, <em>Secondhand Memories</em>. Each instalment appeared on textnovel.com, a website dedicated to cell phone stories. Takatsu had read an English translation of Rin's story <em>If You</em> and had been impressed by its simple and emotional language. It was a feature he deliberately copied when he started writing <em>Secondhand Memories</em>.&nbsp;<span class=\"gm\">[6]</span>&nbsp;He now believes that, in English, cell phone novels have a powerful and poetic identity of their own.</p><p class=\"rp\">Takatsu sees himself, and the other writers who contribute to textnovel.com, as part of a literary movement which blends drama, technology, pop culture and social media. Cell phone novels encourage young people to engage in fiction, even those who would not normally pick up a book. They could be described as teen novels for the 21st century.</p>", "sentences": {"A": "Common themes are love, tragedy and betrayal, and the stories often deal with difficult or controversial issues.", "B": "Books are sometimes regarded as old-fashioned and difficult to read.", "C": "In response to this trend, some smart young authors have changed the way they write.", "D": "However, as the story progressed, the style gradually evolved into something different.", "E": "She typed out instalments on her phone and uploaded them onto a popular website for cell phone authors.", "F": "No money is made from cell phone novels unless they are published as books.", "G": "It was called <em>Deep Love</em> and told the story of a teenager who contracted AIDS.", "H": "Sentences are short and there are no descriptions of anything or anybody because there isn't space."}, "answers_ins": ["C", "G", "A", "E", "H", "D"], "extras_ins": ["B", "F"], "tf_statements": ["The first cell phone novel appeared in Japan.", "The success of Yoshi's first book was due mainly to advertisements on the TV and in comic books.", "Most cell phone novels deal with difficult issues.", "Rin did not tell her parents that she was writing a cell phone novel.", "There is a lot of conversation between the characters in cell phone novels.", "Cell phone novels in English have recently appeared in the USA."], "answers_tf": ["T", "F", "T", "T", "T", "F"]}, {"id": 9, "title": "Miscalculations", "source": "Solutions Intermediate - Unit 9", "type": "text_match", "topic": "Science, engineering and famous mistakes", "skill_name": "Matching statements to texts (inference)", "skill_tips": ["Read each text carefully, noting the cause of the problem in each case.", "Statements often use synonyms or paraphrases - don't just look for exact words.", "'Two distinct causes' = look for a text that mentions two separate reasons.", "'Resulted in a loss of life' = look for deaths or casualties in the text.", "One text matches two statements - once identified, check both fit perfectly."], "vocab": [{"word": "rectify (v)", "definition": "to put something right; to correct a mistake", "forms": "rectification (n) · rectifiable (adj) — root: rect- (straight/right)"}, {"word": "metric system (n phr)", "definition": "a decimal system of weights and measures (metres, kilograms, litres)", "forms": "metric (adj) · metrics (n pl) · metre (n)"}, {"word": "imperial units (n phr)", "definition": "a traditional system of measurement using feet, inches and pounds", "forms": "imperial (adj) · imperially (adv)"}, {"word": "calibrate (v)", "definition": "to adjust or mark a measuring instrument to show accurate readings", "forms": "calibration (n) · calibrated (adj) · calibrator (n)"}, {"word": "unstable (adj)", "definition": "likely to fall or change; not fixed or steady", "forms": "stability (n) · stable (adj) · stabilise (v) — prefix: un- (= not)"}, {"word": "orbit (v)", "definition": "to move in a curved path around a planet or star", "forms": "orbit (n) · orbital (adj) · orbiter (n)"}, {"word": "mission (n)", "definition": "an important task or assignment, especially a military or scientific one", "forms": "missionary (n / adj) · mission control (n phr)"}, {"word": "launch (v)", "definition": "to send a spacecraft, ship or product into action for the first time", "forms": "launch (n) · launcher (n) · launch pad (n phr)"}], "intro": "Read the texts (A–D). Match them with statements 1–6 below. Two texts match with two statements.", "passage": "<p class=\"rp\"><strong>A&nbsp; Can't slow down!</strong></p><p class=\"rp\">There were red faces at the headquarters of French train company SNCF in 2014 when they discovered that 2,000 new trains they had ordered were three centimetres too wide for many station platforms. The error appears to have happened because RFF, the company that runs the rail network, gave SNCF the wrong measurements. Instead of measuring all the platforms on the rail network, they only measured platforms that were less than thirty years old. They didn't realise that the gap between platforms built more than fifty years ago is narrower, because trains in those days were a bit slimmer. The new trains cost &euro;15 billion, so there is no question of rebuilding them. It will be cheaper to alter the width of the platforms. But that has so far cost &euro;50 million and the job is not yet finished: there are still 1,000 platforms that need adjusting.</p><p class=\"rp\"><strong>B&nbsp; Too fat to fit!</strong></p><p class=\"rp\">In September 1999, after a trouble-free 286-day journey from Earth, the <em>Mars Climate Orbiter</em> fired its engines in order to slow down and put itself into orbit around Mars. Its mission was to collect information about the Martian climate and try to discover whether there was water on the surface of the red planet. The engines fired successfully, but that was when the problems started. The spacecraft was only sixty kilometres from the planet's surface, instead of 160 kilometres. According to NASA scientists in Florida, the engine quickly overheated, stopped working and was unable to prevent the spacecraft from continuing straight past the planet. It is now probably orbiting the sun. The accident happened because two sets of engineers, one working in metric (millimetres) and the other working with the imperial system (inches), failed to communicate while they were building the spacecraft. It turned out to be an expensive mistake &ndash; the <em>Mars Climate Orbiter</em> cost &pound;125 million!</p><p class=\"rp\"><strong>C&nbsp; Meet you in the middle?</strong></p><p class=\"rp\">What is sea level? Surely it is the same everywhere on Earth? Well, in fact, it isn't, and that is what led to a problem with a bridge being built across a river between Germany and Switzerland in 2004. In Germany, people measure height in relation to the North Sea, while Switzerland chooses to use the Mediterranean, which is 27 centimetres lower. The engineers were fully aware of this difference between the two versions of sea level. However, as the two sides of the bridge came closer to each other, it became clear that they would not meet exactly, as there was a height difference of over half a metre: 54 centimetres, to be precise. Instead of subtracting 27 centimetres, the German engineers had added 27 centimetres. The German side therefore had to be lowered before the bridge could be completed.</p><p class=\"rp\"><strong>D&nbsp; Top heavy!</strong></p><p class=\"rp\">In 1628, the <em>Vasa</em> was the most powerfully armed warship in the world, with 64 enormous cannons. Her Swedish makers were justifiably proud of her. But twenty minutes into her first journey, she was hit by strong winds. She tipped over to the side, water rushed into the ship and she quickly sank, only a mile from the port. Thirty people died. Over the centuries, scientists have tried to explain why the ship was unstable. Most agreed that the top of the ship was far too heavy, but that was not enough to explain why the ship sank. Now, however, scientists at the Vasa Museum, where the ship is displayed, believe they have the answer. They measured every piece of wood in the ship and found that the vessel is asymmetrical and one side of the ship is much heavier than the other. How did this happen? The scientists discovered four rulers that the workman had used. But the rulers used different scales. Two used 'Swedish feet', which were divided into twelve inches, while the others used 'Amsterdam feet', which had eleven inches in each foot. So different carpenters were using different systems of measurement and this led to the wood on one side being thicker than on the other.</p>", "statements": ["This mishap had two distinct causes.", "This mishap was caused because somebody failed to measure something.", "This mishap involved engineers from two countries.", "This mishap was the result of a mistake made in a country outside Europe.", "This mishap resulted in a loss of life.", "This mishap will need even more money to rectify."], "answers": ["D", "A", "C", "B", "D", "A"], "options": ["A", "B", "C", "D"]}];
var cur=0,timer=0,timerRunning=false,timerInterval=null;
var attempts={};
PRACTICES.forEach(function(p){attempts[p.id]=[];});

function startTimer(){
  if(timerRunning)return;
  timerRunning=true;
  timerInterval=setInterval(function(){
    timer++;
    var m=Math.floor(timer/60),s=timer%60;
    document.getElementById('timerChip').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },1000);
}
function pauseTimer(){timerRunning=false;clearInterval(timerInterval);}
document.getElementById('timerChip').addEventListener('click',function(){
  if(timerRunning)pauseTimer();else startTimer();
});

function buildTabs(){
  var row=document.getElementById('tabRow');row.innerHTML='';
  PRACTICES.forEach(function(p,i){
    var d=document.createElement('div');
    d.className='tab'+(i===cur?' active':'');
    var best=getBest(p.id);
    if(best!==null){d.classList.add('done');d.title='Best: '+best.score+'/'+best.total;}
    d.textContent='Practice '+p.id;
    d.onclick=(function(idx){return function(){switchTo(idx);};})(i);
    row.appendChild(d);
  });
}
function getBest(pid){
  var arr=attempts[pid];
  if(!arr||!arr.length)return null;
  return arr.reduce(function(a,b){return a.score>=b.score?a:b;});
}
function switchTo(idx){
  pauseTimer();timer=0;
  document.getElementById('timerChip').textContent='00:00';
  cur=idx;buildTabs();renderPractice();startTimer();
}

function renderSkillBox(p){
  if(!p.skill_name&&!p.skill_tips)return'';
  var h='<div class="skill-box"><div class="skill-title">&#127941; Reading Skill: '+esc(p.skill_name)+'</div>';
  if(p.skill_tips&&p.skill_tips.length){
    h+='<ul class="skill-tips">';
    p.skill_tips.forEach(function(t){h+='<li>'+esc(t)+'</li>';});
    h+='</ul>';
  }
  h+='</div>';
  return h;
}
function renderVocabBox(p){
  if(!p.vocab||!p.vocab.length)return'';
  var h='<div class="vocab-box"><div class="vocab-title">&#128218; Key Vocabulary</div><div class="vocab-grid">';
  p.vocab.forEach(function(v){
    h+='<div class="vocab-item"><div class="vocab-word">'+esc(v.word)+'</div><div class="vocab-def">'+esc(v.definition)+'</div>';
    if(v.forms)h+='<div class="vocab-forms">&#128257; '+esc(v.forms)+'</div>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

function renderPractice(){
  var p=PRACTICES[cur];
  document.getElementById('textPanel').innerHTML=
    '<div class="ptitle">'+p.title+'</div>'+
    (p.topic?'<div class="ptopic">&#128204; '+esc(p.topic)+'</div>':'')+
    '<div class="psrc">'+p.source+'</div>'+
    p.passage;
  var html='';
  var arr=attempts[p.id];
  if(arr.length){
    html+='<div class="attempt-tags">';
    arr.forEach(function(a,i){
      var pct=Math.round(a.score/a.total*100);
      html+='<span class="atag '+(pct>=60?'pass':'fail')+'" onclick="showAttempt('+p.id+','+i+')" title="'+a.ts+'">Attempt '+(i+1)+': '+a.score+'/'+a.total+' ('+pct+'%)</span>';
    });
    html+='</div>';
  }
  html+=renderSkillBox(p);
  html+='<div class="qsec-label">&#9997;&#65039; Comprehension Exercise</div>';
  if(p.type==='insertion')html+=renderInsertion(p);
  else if(p.type==='mcq')html+=renderMCQ(p);
  else if(p.type==='para_match')html+=renderParaMatch(p);
  else if(p.type==='text_match')html+=renderTextMatch(p);
  else if(p.type==='insertion_tf')html+=renderInsertionTF(p);
  html+='<div class="sub-row">'+
    '<button class="sub-btn" onclick="checkAnswers()">&#10003; Check Answers</button>'+
    '<button class="redo-btn" onclick="resetPractice()">&#8635; Try Again</button>'+
    '</div><div id="resultsBox"></div>';
  html+=renderVocabBox(p);
  document.getElementById('qPanel').innerHTML=html;
}

function renderInsertion(p){
  var keys=Object.keys(p.sentences);
  var h='<div class="exbox"><div class="extitle">Sentence Insertion</div><div class="exinstr">'+p.intro+'</div>';
  h+='<div class="sents-box">';
  keys.forEach(function(k){
    h+='<div class="srow"><span class="slabel">'+k+'</span>'+esc(p.sentences[k])+'</div>';
  });
  h+='</div>';
  for(var i=1;i<=p.answers.length;i++){
    h+='<div class="gap-row"><span class="gap-label">Gap ['+i+']</span><select class="gap-sel" id="ins-'+p.id+'-'+i+'"><option value="">-- choose --</option>';
    keys.forEach(function(k){h+='<option value="'+k+'">'+k+' &ndash; '+esc(p.sentences[k].substring(0,55))+'&hellip;</option>';});
    h+='</select></div>';
  }
  h+='</div>';return h;
}

function selectMCQOpt(el){
  var opts=el.closest('.mcq-opts').querySelectorAll('.mcq-opt');
  opts.forEach(function(o){o.classList.remove('selected');});
  el.classList.add('selected');
}
function renderMCQ(p){
  var L=['a','b','c','d'];
  var h='<div class="exbox"><div class="extitle">Multiple Choice</div><div class="exinstr">'+p.intro+'</div>';
  p.questions.forEach(function(q,qi){
    h+='<p class="mcq-q"><span class="mcq-qnum">'+(qi+1)+'</span>'+esc(q.q)+'</p><div class="mcq-opts">';
    q.opts.forEach(function(o,oi){
      h+='<label class="mcq-opt" onclick="selectMCQOpt(this)"><input type="radio" name="mcq-'+p.id+'-'+qi+'" value="'+L[oi]+'"><span class="mcq-optlabel">'+L[oi]+'</span><span>'+esc(o)+'</span></label>';
    });
    h+='</div>';
  });
  h+='</div>';return h;
}

function renderParaMatch(p){
  var letters=[];
  ['A','B','C','D','E','F','G','H'].forEach(function(l){
    if(p.passage.indexOf('>'+l+'&')>=0||p.passage.indexOf('>'+l+'<')>=0||p.passage.indexOf('>'+l+' ')>=0)letters.push(l);
  });
  var h='<div class="exbox"><div class="extitle">Paragraph Matching</div><div class="exinstr">'+p.intro+'</div>';
  if(p.note)h+='<div style="font-size:.82rem;color:#888;margin-bottom:10px;padding:6px 10px;background:#fffbf0;border-radius:5px;border-left:3px solid #f0c040">&#9888; '+p.note+'</div>';
  p.questions.forEach(function(q,qi){
    h+='<div class="match-row"><span class="match-num">'+(qi+1)+'</span><span class="match-text"><em>'+esc(p.passage_label)+'</em> '+esc(q)+'</span><select class="match-sel" id="pm-'+p.id+'-'+qi+'"><option value="">--</option>';
    letters.forEach(function(l){h+='<option value="'+l+'">'+l+'</option>';});
    h+='</select></div>';
  });
  h+='</div>';return h;
}

function renderTextMatch(p){
  var h='<div class="exbox"><div class="extitle">Text Matching</div><div class="exinstr">'+p.intro+'</div>';
  if(p.note)h+='<div style="font-size:.82rem;color:#888;margin-bottom:10px;padding:6px 10px;background:#fffbf0;border-radius:5px;border-left:3px solid #f0c040">&#9888; '+p.note+'</div>';
  p.statements.forEach(function(st,si){
    h+='<div class="match-row"><span class="match-num">'+(si+1)+'</span><span class="match-text">'+esc(st)+'</span><select class="match-sel" id="tm-'+p.id+'-'+si+'"><option value="">--</option>';
    p.options.forEach(function(o){h+='<option value="'+o+'">'+o+'</option>';});
    h+='</select></div>';
  });
  h+='</div>';return h;
}

function renderInsertionTF(p){
  var keys=Object.keys(p.sentences);
  var h='<div class="exbox"><div class="extitle">Part A: Sentence Insertion</div><div class="exinstr">'+p.intro_ins+'</div>';
  h+='<div class="sents-box">';
  keys.forEach(function(k){
    h+='<div class="srow"><span class="slabel">'+k+'</span>'+esc(p.sentences[k])+'</div>';
  });
  h+='</div>';
  for(var i=1;i<=p.answers_ins.length;i++){
    h+='<div class="gap-row"><span class="gap-label">Gap ['+i+']</span><select class="gap-sel" id="ins-'+p.id+'-'+i+'"><option value="">-- choose --</option>';
    keys.forEach(function(k){h+='<option value="'+k+'">'+k+' &ndash; '+esc(p.sentences[k].substring(0,55))+'&hellip;</option>';});
    h+='</select></div>';
  }
  h+='</div>';
  h+='<div class="exbox"><div class="extitle">Part B: True or False</div><div class="exinstr">'+p.intro_tf+'</div>';
  p.tf_statements.forEach(function(st,si){
    h+='<div class="tf-row"><span class="tf-num">'+(si+1)+'</span><span class="tf-stmt">'+esc(st)+'</span><div class="tf-btns">'+
      '<button class="tf-btn" id="tf-'+p.id+'-'+si+'-T" onclick="selTF('+p.id+','+si+',\'T\')">T</button>'+
      '<button class="tf-btn" id="tf-'+p.id+'-'+si+'-F" onclick="selTF('+p.id+','+si+',\'F\')">F</button>'+
      '</div></div>';
  });
  h+='</div>';return h;
}

function selTF(pid,idx,val){
  var other=val==='T'?'F':'T';
  var btn=document.getElementById('tf-'+pid+'-'+idx+'-'+val);
  var obtn=document.getElementById('tf-'+pid+'-'+idx+'-'+other);
  if(btn.classList.contains('sel-'+val)){btn.classList.remove('sel-'+val);}
  else{btn.classList.add('sel-'+val);obtn.classList.remove('sel-'+other);}
}

function checkAnswers(){
  var p=PRACTICES[cur];var results=[];var score=0,total=0;
  if(p.type==='insertion'){
    for(var i=1;i<=p.answers.length;i++){
      var sel=document.getElementById('ins-'+p.id+'-'+i);
      var u=sel?sel.value:'',c=p.answers[i-1],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Gap ['+i+']',user:u||'(blank)',correct:c,ok:ok});
    }
  }else if(p.type==='mcq'){
    p.questions.forEach(function(q,qi){
      var radios=document.querySelectorAll('input[name="mcq-'+p.id+'-'+qi+'"]');
      var u='';radios.forEach(function(r){if(r.checked)u=r.value;});
      var c=p.answers[qi],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Q'+(qi+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(q.q.substring(0,55))+'...'});
    });
  }else if(p.type==='para_match'){
    p.questions.forEach(function(q,qi){
      var sel=document.getElementById('pm-'+p.id+'-'+qi);
      var u=sel?sel.value:'',c=p.answers[qi],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Q'+(qi+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(q.substring(0,55))+'...'});
    });
  }else if(p.type==='text_match'){
    p.statements.forEach(function(st,si){
      var sel=document.getElementById('tm-'+p.id+'-'+si);
      var u=sel?sel.value:'',c=p.answers[si],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Statement '+(si+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(st.substring(0,55))+'...'});
    });
  }else if(p.type==='insertion_tf'){
    for(var i=1;i<=p.answers_ins.length;i++){
      var sel=document.getElementById('ins-'+p.id+'-'+i);
      var u=sel?sel.value:'',c=p.answers_ins[i-1],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Gap ['+i+']',user:u||'(blank)',correct:c,ok:ok});
    }
    p.tf_statements.forEach(function(st,si){
      var tB=document.getElementById('tf-'+p.id+'-'+si+'-T');
      var fB=document.getElementById('tf-'+p.id+'-'+si+'-F');
      var u=tB&&tB.classList.contains('sel-T')?'T':fB&&fB.classList.contains('sel-F')?'F':'';
      var c=p.answers_tf[si],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'TF '+(si+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(st.substring(0,55))+'...'});
    });
  }
  var pct=Math.round(score/total*100);
  var now=new Date();
  var ts=now.toLocaleTimeString();
  var dateStr=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  var userName=document.getElementById('userName').value.trim()||'(not entered)';
  var userEmail=document.getElementById('userEmail').value.trim()||'(not entered)';
  attempts[p.id].push({score:score,total:total,pct:pct,ts:ts,results:results,name:userName,email:userEmail});
  buildTabs();
  var h='<div class="report-card">'+
    '<div class="report-header">'+
      '<div>'+
        '<div class="report-user">&#128100; '+esc(userName)+'</div>'+
        '<div class="report-meta">&#9993; '+esc(userEmail)+'&nbsp;&nbsp;|&nbsp;&nbsp;&#128204; '+esc(p.source)+'</div>'+
      '</div>'+
      '<div class="report-stamp">'+dateStr+'<br>'+ts+'</div>'+
    '</div>'+
    '<div class="score-box" style="margin-bottom:0">'+
      '<div class="score-item"><div class="score-val">'+score+'/'+total+'</div><div class="score-lbl">Score</div></div>'+
      '<div class="score-item"><div class="score-val">'+pct+'%</div><div class="score-lbl">Percent</div></div>'+
      '<div class="score-item"><div class="score-val">'+(pct>=60?'&#10003; Pass':'&#10007; Fail')+'</div><div class="score-lbl">Result</div></div>'+
    '</div>'+
  '</div>';
  h+='<div class="res-banner '+(pct>=60?'res-pass':'res-fail')+'">'+(pct>=60?'&#10003; Well done! '+pct+'% correct.':'&#10007; Keep practising. '+pct+'% correct.')+' ('+score+'/'+total+')</div>';
  results.forEach(function(r){
    h+='<div class="q-result"><div class="q-rh '+(r.ok?'correct':'wrong')+'">'+
      '<span>'+(r.ok?'&#10003;':'&#10007;')+' '+r.label+(r.qtext?' &mdash; <span style="font-weight:400;font-size:.8rem">'+r.qtext+'</span>':'')+'</span>'+
      '<span class="ans-lbl">Yours: <strong>'+r.user+'</strong> | Correct: <strong>'+r.correct+'</strong></span>'+
      '</div></div>';
  });
  document.getElementById('resultsBox').innerHTML=h;
  document.getElementById('resultsBox').scrollIntoView({behavior:'smooth',block:'start'});
}

function resetPractice(){
  pauseTimer();timer=0;
  document.getElementById('timerChip').textContent='00:00';
  renderPractice();startTimer();
}
function resetAll(){
  attempts={};PRACTICES.forEach(function(p){attempts[p.id]=[];});switchTo(0);

function sendToTeacher(){
  var userName=document.getElementById('userName').value.trim()||'(not entered)';
  var userEmail=document.getElementById('userEmail').value.trim()||'(not entered)';
  var now=new Date();
  var dateStr=now.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  var body='READING PRACTICE RESULTS - HUONG STELLA PARADIGM\n';
  body+='==========================================\n';
  body+='Student: '+userName+'\n';
  body+='Email: '+userEmail+'\n';
  body+='Date: '+dateStr+'\n\n';
  var totalScore=0,totalMax=0,anyAttempt=false;
  PRACTICES.forEach(function(p){
    var arr=attempts[p.id]||[];
    body+='Practice '+p.id+': '+p.title+'\n';
    if(arr.length===0){
      body+='  (no attempts)\n';
    }else{
      anyAttempt=true;
      arr.forEach(function(a,i){
        body+='  Attempt '+(i+1)+': '+a.score+'/'+a.total+' ('+a.pct+'%) - '+(a.pct>=60?'PASS':'FAIL')+' ['+a.ts+']\n';
      });
      var best=arr.reduce(function(a,b){return a.score>=b.score?a:b;});
      body+='  Best: '+best.score+'/'+best.total+' ('+best.pct+'%)\n';
      totalScore+=best.score;totalMax+=best.total;
    }
    body+='\n';
  });
  if(anyAttempt&&totalMax>0){
    body+='==========================================\n';
    body+='OVERALL BEST SCORES: '+totalScore+'/'+totalMax+' ('+Math.round(totalScore/totalMax*100)+'%)\n';
  }
  var subject=encodeURIComponent('Reading Practice Results - '+userName+' - '+dateStr);
  var bodyEnc=encodeURIComponent(body);
  window.location.href='mailto:huongstella8@gmail.com?subject='+subject+'&body='+bodyEnc;
}
function esc(s){
  if(!s)return'';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
