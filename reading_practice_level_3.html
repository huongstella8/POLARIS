<script>

var PRACTICES = [{"id": 1, "title": "Adolescence", "source": "Solutions Intermediate - Unit 1", "type": "insertion", "topic": "Growing up and family relationships", "skill_name": "Sentence insertion", "skill_tips": ["Read the whole text first to understand the general meaning.", "Look at the sentence before AND after each gap - both give clues.", "Check for linking words (however, but, now, also) that connect ideas.", "Make sure the inserted sentence fits grammatically and logically.", "Use the extra sentences as a check: they should NOT fit any gap."], "vocab": [{"word": "adolescence", "definition": "the period of development between childhood and adulthood (roughly ages 10-19)"}, {"word": "resent", "definition": "to feel angry or upset about something you think is unfair"}, {"word": "boundaries", "definition": "limits that define acceptable behaviour"}, {"word": "independent", "definition": "able to think and act for yourself without needing help from others"}, {"word": "transform", "definition": "to change completely in form or character"}, {"word": "dependent", "definition": "needing someone or something to survive or succeed"}, {"word": "value (v.)", "definition": "to consider something important and worthwhile"}, {"word": "point of view", "definition": "a particular way of thinking about or judging a situation"}], "intro": "Read the article. Match sentences A-G with gaps 1-5 in the text. There are two extra sentences.", "passage": "<p class=\"rp\"><strong>Getting on with your parents</strong></p><p class=\"rp\">Parents get a lot of advice on how to handle their adolescent children, but what about some advice for teenagers on how to deal with <em>their</em> parents? Relationship expert Rachel Harris offers some tips.</p><p class=\"rp\">What is adolescence? It starts when you are aged between about ten and thirteen and is a period of rapid change, which transforms you from a pre-teen, still dependent on your parents, to the independent young adult that you are becoming. Here are the most common social and emotional changes that happen during adolescence.</p><p class=\"rp\"><strong>FREEDOM</strong>&nbsp;<span class=\"gm\">[1]</span>&nbsp;You need your own space and more freedom to make your own choices.</p><p class=\"rp\"><strong>INTERESTS</strong>&nbsp;You have new interests and they might include activities that your parents don't understand or think are a waste of time, such as playing computer games or chatting on the internet.&nbsp;<span class=\"gm\">[2]</span></p><p class=\"rp\"><strong>DECISIONS</strong>&nbsp;In the past, your parents made most decisions for you and told you what to do.&nbsp;<span class=\"gm\">[3]</span>&nbsp;You may resent them for telling you what to do. Try to be yourself and choose how to spend your time.</p><p class=\"rp\"><strong>OPINIONS</strong>&nbsp;When you were younger, you saw the world through your parents' eyes.&nbsp;<span class=\"gm\">[4]</span>&nbsp;It is not true to say that adolescents always think they know best, but they are developing their own ideas.</p><p class=\"rp\"><strong>CONFIDENCE</strong>&nbsp;Adolescents often feel confused and impatient.&nbsp;<span class=\"gm\">[5]</span></p><p class=\"rp\">All these changes are perfectly normal, but it is important to remember that they will affect your relationship with your parents. So what can you do to make life easier and stay on good terms? First, let your parents know that you still love and value them. Secondly, try to agree rules and boundaries - your parents' main concern is often just to keep you safe. And always try to understand their point of view.</p>", "sentences": {"A": "They may not say so, but they are probably feeling a sense of loss over the little child you once were.", "B": "Your parents will expect you to behave responsibly and to keep to the rules.", "C": "But now you want to decide things for yourself and you don't want to be told what to do all the time.", "D": "As your body changes, you also begin to think and feel like an adult.", "E": "Despite this, you should always listen carefully to what your parents have to say.", "F": "Now you are beginning to see the world differently, developing your own views and your own sense of right and wrong.", "G": "Now you probably want to spend more time on your own or with friends of your own age."}, "answers": ["D", "G", "C", "F", "A"], "extras": ["B", "E"]}, {"id": 2, "title": "Field Games", "source": "Solutions Intermediate - Unit 2", "type": "mcq", "topic": "Outdoor activities and adventure", "skill_name": "Multiple choice (4 options)", "skill_tips": ["Read the question carefully - identify exactly what is being asked.", "Read all four options before choosing - don't stop at the first plausible answer.", "Eliminate obviously wrong answers first to narrow down your choice.", "Watch for distractors: options that mention words from the text but in the wrong context.", "Questions usually follow the order of the text - use this to locate the relevant paragraph."], "vocab": [{"word": "co-ordinates", "definition": "a set of numbers that identify a precise location on a map or GPS"}, {"word": "waterproof", "definition": "not allowing water to pass through"}, {"word": "logbook", "definition": "a book used to record events or findings"}, {"word": "letterboxing", "definition": "a traditional British outdoor activity using maps to find hidden boxes"}, {"word": "cache", "definition": "a hidden store of things (in geocaching, the hidden container)"}, {"word": "participants", "definition": "people who take part in an activity or event"}, {"word": "strenuous", "definition": "requiring a lot of physical effort"}, {"word": "high-tech", "definition": "using the most modern and advanced technology"}], "intro": "Read the blog post. Choose the correct options (a-d).", "passage": "<p class=\"rp\"><strong>Geocaching - the world's biggest treasure hunt</strong></p><p class=\"rp\">Geocaching began in May 2000 when a man in Oregon, USA, hid a box in the woods and posted the GPS co-ordinates on the internet. Within days, people were using handheld GPS devices to find it. Now there are over two million 'geocaches' hidden around the world, in 180 countries, and millions of people are playing the game.</p><p class=\"rp\">Geocaching is the modern, high-tech version of an old British game called letterboxing, which began on Dartmoor in Devon in 1854 - though letterboxing uses a map and compass rather than GPS. In letterboxing, participants search for a hidden waterproof box containing a logbook and a rubber stamp. They stamp the logbook with their own personal stamp and stamp their own notebook with the stamp in the box.</p><p class=\"rp\">Geocaching follows similar rules. To play, you need a GPS-enabled mobile phone or device, a pen and a logbook (if the cache is big enough). You go to the co-ordinates, find the cache - usually a waterproof container - sign the logbook and put it back exactly where you found it. Many geocaches contain small gifts. You are allowed to take a gift, but only if you replace it with something of a similar value.</p><p class=\"rp\">In Sweden, they take geocaching to a different level with a game called 'The Fumble after Oak'. Here, participants travel across a large area of Sweden trying to find oak trees with GPS co-ordinates carved into them. This event attracts thousands of participants, who travel hundreds of kilometres. It is less about finding a container and more about the journey itself - and enjoying the Swedish countryside.</p><p class=\"rp\">I tried geocaching last weekend with my two kids. Armed with just a smartphone, we were off! Within minutes we had found our first cache - a small tin hidden under a park bench. Inside was a logbook and a tiny toy. We signed our names and moved on. By the end of the day we had found seven caches. My kids couldn't stop talking about it all the way home. So what are you waiting for? Get out there and start geocaching!</p>", "questions": [{"q": "To take part in geocaching you need", "opts": ["a GPS device or smartphone, and something to sign your name", "a mobile phone with GPS and a toy or gift", "a mobile phone, a toy or gift and a logbook", "nothing - just yourself"]}, {"q": "The activity of geocaching", "opts": ["began in the 19th century but only became popular after 2000", "was originally only popular in one region of England, but now has fans all over the world", "was called letterboxing when it was first invented", "is now enjoyed in over 180 countries around the world"]}, {"q": "When you find a gift in a geocache you", "opts": ["must make a note of the gift on the website", "can borrow it but have to return it within a week", "are allowed to take it if you replace it with something of similar value", "must leave it there for the next person to find"]}, {"q": "The Fumble after Oak event is special because", "opts": ["it is only open to Swedish people", "participants focus on exploring the countryside rather than just finding containers", "it is the oldest geocaching event in the world", "it uses rubber stamps instead of GPS"]}, {"q": "The writer believes the Fumble after Oak event", "opts": ["is more fun than geocaching with a couple of friends", "would be a very enjoyable event to attend", "is only suitable for adventurous people", "needs to attract more participants"]}, {"q": "The writer has written the blog mainly to", "opts": ["suggest that people try geocaching", "explain the differences between letterboxing and geocaching", "publicise a geocaching event in Sweden", "warn the reader that geocaching is addictive"]}], "answers": ["a", "d", "c", "b", "b", "a"]}, {"id": 3, "title": "Body Clock", "source": "Solutions Intermediate - Unit 3", "type": "para_match", "topic": "Health, science and the human body", "skill_name": "Paragraph matching", "skill_tips": ["Skim all paragraphs first to understand what each one is about.", "Identify the key theme or time period of each paragraph.", "Some paragraphs will match more than one question - this is normal.", "Focus on the specific detail asked in each question.", "Cross-reference your answers: if a paragraph matches two questions, make sure both fit perfectly."], "vocab": [{"word": "melatonin", "definition": "a hormone produced by the body that regulates sleep and wakefulness"}, {"word": "cognitive", "definition": "relating to mental processes such as thinking, memory and learning"}, {"word": "siesta", "definition": "a short sleep or rest taken in the early afternoon, common in hot countries"}, {"word": "strenuous", "definition": "requiring great physical effort"}, {"word": "immune system", "definition": "the body's natural defence system against illness and infection"}, {"word": "alertness", "definition": "the state of being watchful and ready to respond quickly"}, {"word": "suppress", "definition": "to prevent something from happening or being expressed"}, {"word": "peak (v.)", "definition": "to reach the highest point or level"}], "intro": "Match the paragraphs (A-H) with questions 1-10 below. Some paragraphs match more than one question.", "passage_label": "In which period of the day...", "passage": "<p class=\"rp\"><strong>Your body clock - hour by hour</strong></p><p class=\"rp\"><strong>A&nbsp; 5 AM - 9 AM</strong>&nbsp;Your body is waking up. It stops producing melatonin, the hormone which makes you feel sleepy. Blood pressure rises and body temperature starts rising too. Your blood is thicker and your blood pressure is higher in the morning than at other times of day. This makes heart attacks more likely at this time. Some people feel sluggish and find it hard to get out of bed - but your body is preparing for the day ahead.</p><p class=\"rp\"><strong>B&nbsp; 9 AM - 12 PM</strong>&nbsp;You're at your most alert and your short-term memory is at its best. This is the ideal time for learning new things, as your concentration is excellent. Tests show that cognitive functions - such as reading, maths and problem-solving - are performed more efficiently now. It's also a good time to exercise as your muscles are warm and ready. Your body digests food effectively at this time of day.</p><p class=\"rp\"><strong>C&nbsp; 12 PM - 3 PM</strong>&nbsp;Your stomach is full and working hard after lunch. You become much more likely to feel sleepy and your reaction times slow down. Traffic accidents are more common at this time of day. The midday meal causes blood sugar to peak and then drop quickly, which makes you feel tired. Many cultures around the world have traditionally taken a midday rest or siesta for this reason. However, your digestion of certain foods, like sugar, is less efficient now.</p><p class=\"rp\"><strong>D&nbsp; 3 PM - 6 PM</strong>&nbsp;This is a very good time to concentrate. Your heart and lungs work best, and your muscles are six per cent stronger than at their weakest point. If you try to learn something at this time of day, you'll have a good chance of success. Physical and mental performance peak in the late afternoon. Athletes who compete or train at this time tend to achieve their best performances. This is the best time for strenuous physical activity.</p><p class=\"rp\"><strong>E&nbsp; 6 PM - 9 PM</strong>&nbsp;You're probably starting to feel hungry. But don't eat too much in the evening - your body struggles to digest food and sugar effectively after 6 PM. Try to eat lightly. Many nutritionists recommend having your main meal at lunchtime rather than in the evening. What time you eat is less important than how much you eat, but lighter meals in the evening aid sleep.</p><p class=\"rp\"><strong>F&nbsp; 9 PM - 10 PM</strong>&nbsp;It's getting near to bedtime. Your body temperature starts to drop and you begin to feel sleepy as melatonin levels start to rise. Your body is preparing for sleep. Avoid screens - phones, computers and flat-screen TVs emit a blue light which suppresses melatonin, keeping you awake. Reading a book or listening to calm music is much better preparation for a good night's sleep.</p><p class=\"rp\"><strong>G&nbsp; 10 PM - 2 AM</strong>&nbsp;Deep sleep. This is the most important sleep period. Your body completely stops digesting food and focuses on repair and recovery. Growth hormone is released, repairing muscles and cells. Your immune system is most active. Your body temperature falls to its lowest point. Without adequate sleep in this period, you feel tired, irritable and less able to concentrate the next day.</p><p class=\"rp\"><strong>H&nbsp; 2 AM - 5 AM</strong>&nbsp;Melatonin levels are at their highest, and you are in your deepest sleep. Your body temperature is at its coldest and your blood pressure is at its lowest. Older people and those who work night shifts are more likely to have accidents at this time due to reduced alertness. Your concentration will decrease sharply if you are woken at this time. This is also when your body begins to become slightly warmer before the morning rise in temperature.</p>", "questions": ["do you completely stop digesting food?", "is it best to be physically active?", "does your body have difficulty digesting certain foods?", "are older people more likely to have accidents?", "does your body contain the most melatonin?", "are you best at remembering things over short periods of time?", "are you at your strongest physically?", "does your body stop making melatonin?", "is your body at its coldest?", "does your body begin to become cooler?"], "answers": ["G", "D", "C", "H", "H", "B", "D", "A", "H", "F"], "note": ""}, {"id": 4, "title": "Alternative Living", "source": "Solutions Intermediate - Unit 4", "type": "text_match", "topic": "Housing, environment and sustainability", "skill_name": "Matching statements to texts", "skill_tips": ["Read all the short texts quickly first to understand each one's main idea.", "Underline the key noun in each statement (e.g. 'recycled materials', 'energy self-sufficient').", "Search for that key idea in the texts - it may be expressed in different words (paraphrasing).", "Some texts match two statements - keep this in mind and don't stop after one match.", "Check every answer: re-read the matched paragraph to confirm your choice."], "vocab": [{"word": "sculptor", "definition": "an artist who creates three-dimensional works of art"}, {"word": "insulate", "definition": "to cover something to prevent heat, cold or sound from passing through"}, {"word": "self-sufficient", "definition": "able to produce everything you need without outside help"}, {"word": "stackable", "definition": "designed so that one can be placed on top of another"}, {"word": "recycled", "definition": "converted from waste into reusable material"}, {"word": "philosopher", "definition": "a person who studies or develops theories about the nature of existence and knowledge"}, {"word": "solar panel", "definition": "a device that converts sunlight into electricity"}, {"word": "converted", "definition": "changed from one use or purpose to another"}], "intro": "Read the texts (A-D). Match them with statements 1-7 below. Two texts match with two statements each.", "passage": "<p class=\"rp\"><strong>A&nbsp; Street artist and sculptor</strong></p><p class=\"rp\">Gregory Kloehn is a street artist and sculptor who makes his own unusual homes and also builds them for homeless people. He searches in rubbish dumps for the materials he uses. A washing machine door can become a window. A fridge door has useful shelves on the inside. The homes Gregory builds are small - they measure less than two square metres - but he insists they contain everything a person needs. He has built over twenty of these homes for people sleeping on the streets of Oakland, California. Gregory runs workshops to show others how to build these structures. You can now find thousands of instructional videos on YouTube if you want to make your own!</p><p class=\"rp\"><strong>B&nbsp; Tiny homes</strong></p><p class=\"rp\">The 'tiny house' movement is a social movement where people choose to live in very small homes. Tiny homes are usually between 10 and 40 square metres in size. They can come with wheels, so you can take your home wherever you want to go. Ryan Mitchell is the founder of thetinylife.com, a website which organises conferences for interested people. With wheels on their home, people are free to travel. Ryan Mitchell himself lives in a cosy wooden home measuring just 14 square metres. 'It's completely transformed my life,' he says. 'I now own everything I need and owe nothing to anyone.'</p><p class=\"rp\"><strong>C&nbsp; Micro-house</strong></p><p class=\"rp\">The Diogene micro-house was designed by architect Renzo Piano, who also designed the Shard skyscraper in London. The house is called 'Diogene', named after the ancient Greek philosopher Diogenes, who rejected luxury by living in a large ceramic jar. It measures just 2.4 x 2.4 metres and can be lived in by one person. It's really energy-efficient, with solar panels on the roof that generate enough electricity to power all its systems. It also has a container to collect rainwater. The house is fully self-sufficient and needs no connection to power or water networks.</p><p class=\"rp\"><strong>D&nbsp; Shipping containers</strong></p><p class=\"rp\">The Brighton Housing Trust in the UK has converted old shipping containers into homes for people who would otherwise be living on the streets. The project was inspired by a similar housing estate in the Netherlands. The containers have been insulated and fitted with windows and doors. They are also stackable - the containers will sit on top of one another with stairs connecting them. Each container home has a small kitchen, a bathroom and a living space. The new homes cost £15,000 each, so there is no question that they represent good value for money. Residents pay a small amount of rent and receive help to prepare for independent living.</p>", "statements": ["There is information on the internet to show people how to build these homes themselves.", "The builder of these homes uses only recycled materials.", "The builder was inspired by a philosopher who chose to live simply.", "The designer gives practical help to people who want to build homes like these.", "These homes are energy self-sufficient.", "The people behind the project were inspired by similar work in another European country.", "These homes can be put together to make a block of flats."], "answers": ["B", "A", "C", "B", "C", "D", "D"], "options": ["A", "B", "C", "D"]}, {"id": 5, "title": "Clever Machines", "source": "Solutions Intermediate - Unit 5", "type": "mcq", "topic": "Technology and artificial intelligence", "skill_name": "Multiple choice (detailed comprehension)", "skill_tips": ["Read the whole text once without stopping, then read the questions.", "For each question, locate the relevant section of the text before choosing.", "Watch for questions about the writer's purpose or opinion - these test inference, not just facts.", "Be careful with 'NOT' questions - they ask for the false option.", "Vocabulary questions: use context clues from the surrounding sentences."], "vocab": [{"word": "artificial intelligence", "definition": "the ability of a computer or machine to perform tasks that normally require human intelligence"}, {"word": "chatbot", "definition": "a computer program designed to simulate conversation with human users"}, {"word": "diagnose", "definition": "to identify the nature of an illness or problem through examination"}, {"word": "mathematician", "definition": "a person who studies or works in mathematics"}, {"word": "convince", "definition": "to cause someone to believe something or to do something"}, {"word": "intelligence", "definition": "the ability to learn, understand and reason"}, {"word": "simulate", "definition": "to create a model or imitation of something"}, {"word": "debate", "definition": "a discussion involving different points of view on a topic"}], "intro": "Read the article about artificial intelligence. Choose the correct options (a-d).", "passage": "<p class=\"rp\"><strong>Chatbots and the Turing Test</strong></p><p class=\"rp\">The Turing Test, designed to measure artificial intelligence, was invented by British mathematician Alan Turing. Fifty or sixty years ago, computers were very simple machines, but even then scientists believed that one day machines would be able to 'think' and that they would probably be as intelligent as humans. The question was: 'How can we measure the intelligence of a machine?' Alan Turing, who had helped to break the German Enigma code during the Second World War, came up with an answer. He said we need to ask: 'Can this computer talk? Can it have a conversation like a human?' If it can, he argued, then it is intelligent and it can think. In a Turing Test, judges sit at a screen and have a chatroom conversation with a chatbot program. They don't know if they are chatting with another person or with a chatbot. After exchanging messages for five minutes, the judge decides if he or she is chatting with a human or a machine.</p><p class=\"rp\">Mitsuku was the winner of the Loebner Prize in 2013, an annual competition to find a program that can pass the Turing Test. Mitsuku passed the test in 2013, beating human contestants. The program was created by programmer Steve Worswick from Leeds. However, many scientists argue that the Turing Test is not a good measure of real intelligence. They say that a program can 'pass' the test by being programmed with clever conversation tricks, without truly understanding language. The debate about what 'real' intelligence means continues.</p><p class=\"rp\">What is certain is that chatbot technology is developing rapidly. Today's chatbots can help customers on websites, answer phone calls and even diagnose medical conditions. Some experts believe that within the next twenty years, chatbots will be so advanced that we will not be able to tell the difference between talking to a human and talking to a machine. The question then becomes not 'Can machines think?' but 'Does it matter if they can?'</p>", "questions": [{"q": "What was Alan Turing's main achievement described in the text?", "opts": ["He invented the first chatbot program", "He decided that machines could never be truly intelligent", "He created a test to measure machine intelligence", "He won the Loebner Prize in 2013"]}, {"q": "In the Turing Test, the judges", "opts": ["talk face-to-face with a computer", "chat online without knowing if they are talking to a human or machine", "programme the chatbot themselves", "compete against each other to spot the machine"]}, {"q": "Some scientists criticise the Turing Test because", "opts": ["it is too easy for humans to pass", "judges are not qualified to make decisions about intelligence", "a program can pass it using clever tricks without real understanding", "it was invented too long ago to be relevant today"]}, {"q": "The word 'it' in 'If it can' refers to", "opts": ["the computer", "the Enigma code", "the judge", "the Turing Test"]}, {"q": "What is the writer's overall message about chatbots?", "opts": ["They are a danger to human employment", "They have already achieved the same intelligence as humans", "The technology is advancing rapidly and raises big questions", "They are useful but will never truly replace human conversation"]}], "answers": ["a", "b", "c", "a", "c"]}, {"id": 6, "title": "#GIRLBOSS", "source": "Solutions Intermediate - Unit 6", "type": "insertion_tf", "topic": "Business, entrepreneurship and success", "skill_name": "Sentence insertion + True/False", "skill_tips": ["For insertion: read the sentence before and after each gap - both give context clues.", "Look for pronoun references (she, it, they) that must refer to something already mentioned.", "For True/False: find the exact part of the text that the statement refers to.", "False statements often change a key detail (number, name, direction) from the original.", "Don't mark something False just because it isn't mentioned - it must contradict the text."], "vocab": [{"word": "entrepreneur", "definition": "a person who sets up a business, taking on financial risks in the hope of profit"}, {"word": "retailer", "definition": "a business that sells goods directly to consumers"}, {"word": "vintage", "definition": "of high quality from a past era; (of clothing) from a previous decade"}, {"word": "revenue", "definition": "the income that a business receives from its activities"}, {"word": "profit", "definition": "the financial gain made when revenue exceeds costs"}, {"word": "shoplifting", "definition": "stealing goods from a shop"}, {"word": "flock (v.)", "definition": "to move or gather together in large numbers"}, {"word": "brand", "definition": "a type of product made by a particular company under a particular name"}], "intro_ins": "Read the article. Match sentences A-H with gaps 1-6 in the text. There are two extra sentences.", "intro_tf": "Read the text again. Are the sentences true (T) or false (F)?", "passage": "<p class=\"rp\"><strong>Sophia Amoruso - CEO of Nasty Gal</strong></p><p class=\"rp\">Sophia Amoruso is the highly successful CEO of Nasty Gal, an online fashion retailer with over 550,000 customers in 150 countries.&nbsp;<span class=\"gm\">[1]</span>&nbsp;She dropped out of school and left home. For a couple of years she was hitchhiking around, and then got arrested for shoplifting. She got a job in a clothes shop, from which she was soon fired. Her next job was on the reception desk at an art school, checking students' IDs.</p><p class=\"rp\">While sitting at her computer, she started visiting shopping websites, such as eBay.&nbsp;<span class=\"gm\">[2]</span>&nbsp;She noticed that well-dressed people in photographs on those sites attracted a lot more interest. She decided to start buying and selling vintage designer clothes - clothes that would appeal to fashion-aware women. Having named her eBay store 'Nasty Gal Vintage', she expanded her social media presence.</p><p class=\"rp\"><span class=\"gm\">[3]</span>&nbsp;By selecting and promoting the best vintage clothes to her MySpace page, where she had so many followers that clothes were flooding in. Living in secondhand clothes shops and charity shops, and spending hours searching for designer clothes, she bought a Chanel jacket at a Salvation Army store for a couple of dollars and sold it on eBay for $1,000.&nbsp;<span class=\"gm\">[4]</span>&nbsp;She searched and searched, and found pieces that she could buy for very little money and sell for great profit.</p><p class=\"rp\">Clothes were more likely to sell at a high price when they were worn by real people rather than photographed hanging on door handles or lying on a flat surface. 'Put on the right clothes. The right light. The right pose. The right expression and you can make a fortune,' she explained. She had very little money to spend on photography, so she did everything herself.</p><p class=\"rp\">By 2011, Nasty Gal was one of the fastest-growing companies in the USA.&nbsp;<span class=\"gm\">[5]</span>&nbsp;The customers who hadn't heard of the brand were now flocking to her website because she had learned all the tricks of social media.&nbsp;<span class=\"gm\">[6]</span>&nbsp;By 2012, revenues had reached $128 million. Sophia's story shows that with determination, creativity and business sense, anyone can make it - no matter where they started from.</p>", "sentences": {"A": "She began to realise she could sell some of the clothes she found in charity shops for much more than she paid for them.", "B": "She expanded her social media presence by selecting and promoting the best vintage items on her MySpace page.", "C": "She wasn't exactly a typical young entrepreneur - and certainly not like the majority of CEOs you come across these days.", "D": "She expanded her social media presence by creating a MySpace page where she could post photographs of herself wearing vintage clothes.", "E": "The customers who bought her clothes were young women who couldn't afford to buy new designer items.", "F": "Her followers saw that these clothes were worn by real people and they couldn't spend money fast enough.", "G": "She was interested in lifestyle photography, and noticed that well-dressed people attracted far more attention.", "H": "The Nasty Gal brand had become so strong that people were travelling from all over the world to visit her shop."}, "answers_ins": ["C", "G", "D", "A", "F", "E"], "extras_ins": ["B", "H"], "tf_statements": ["Sophia had a successful school career before starting her business.", "Sophia's first business idea involved selling clothes on eBay.", "Sophia sold a Chanel jacket for a couple of dollars at a Salvation Army store.", "Sophia used professional photographers to make her products look good.", "By 2011, Nasty Gal was one of the fastest-growing businesses in the USA.", "Nasty Gal's revenue reached $128 million by 2012."], "answers_tf": ["F", "T", "F", "F", "T", "T"]}, {"id": 7, "title": "Graffiti's Softer Side", "source": "Solutions Intermediate - Unit 7", "type": "mcq", "topic": "Art, creativity and public spaces", "skill_name": "Multiple choice (attitude and opinion)", "skill_tips": ["MCQ questions follow the same order as information in the text — use this to locate answers quickly.", "The correct option matches the meaning of the text but uses different words (paraphrase).", "Check the other options are either not mentioned or contradict the text.", "Questions about the writer's overall opinion come last — think about the whole article, not just one paragraph.", "If you can't decide between options, an intelligent guess is better than no answer."], "vocab": [{"word": "irritate", "definition": "to make someone feel annoyed or impatient"}, {"word": "vandalism", "definition": "deliberate destruction or damage of public or private property"}, {"word": "littering", "definition": "dropping rubbish or waste in a public place"}, {"word": "temporary", "definition": "lasting for only a short time; not permanent"}, {"word": "amusement", "definition": "the feeling of being entertained or finding something funny"}, {"word": "endangered species", "definition": "a type of animal or plant that may soon become extinct"}, {"word": "feminine", "definition": "having qualities traditionally associated with women"}, {"word": "marine life", "definition": "living organisms that exist in the sea"}], "intro": "Read the article about yarn bombing. For questions 1–6, choose the correct answers (a–d).", "passage": "<p class=\"rp\"><strong>Granny graffiti</strong></p><p class=\"rp\">The statue of Rocky outside the Philadelphia Museum of Art is very popular with tourists, who often stop to take their photo in front of it without bothering to visit the museum itself. This irritated Jessie Hemmons, so last month the 24-year-old artist knitted a bright pink jacket and put it on the statue of the boxer. She chose the colour because it attracts attention. On the front of the jacket, Jessie has knitted the words 'Go see the art'. Jessie hopes that her message will result in more people visiting the gallery.</p><p class=\"rp\">This form of street art has become known as 'yarn bombing'.</p><p class=\"rp\">The craze is believed to have started in 2005, when Magda Sayeg was working at Raye, her shop in Houston, Texas. One day she decided, just for fun, to knit a blue-and-pink cover for the shop's door handle. She loved it, and &ndash; unexpectedly &ndash; so did her customers. Pedestrians stopped on the pavement outside the shop to photograph it, and even motorists slowed down to take a closer look. Their reaction inspired Magda to make covers for other objects in the street, such as a stop sign, a lamp post, a parking meter &ndash; and even an entire bus, which took a whole week to complete! She decided to set up a group of knitters, which she called 'Knitta Please'. Photos of their creations kept appearing on blogs and social networking sites and the craze soon spread. There are now yarn bombing groups in dozens of countries and they have covered bus stops, bicycle racks, benches, phone boxes and even fountains! Like most types of street art, the works are temporary and begin to fall apart within a few weeks, so yarn bombers photograph and film their works and upload them to the internet, where everybody can see them.</p><p class=\"rp\">Some of the men who want to have their photos taken with Rocky are disappointed when they see the jacket, but Jessie is pleased that they react that way. She believes that most street art is done by men and that yarn bombing is a more feminine activity. But not everyone approves of the new form of street art. Some people argue that if it is done without permission, then covering public objects in wool is vandalism and littering. That may be true in the eyes of the law, but the police appear to take a relatively relaxed attitude to yarn bombers. They might interrupt them if they see them at work in the street, but yarn bombers say the police are more likely to find their activities amusing than view them as criminal.</p><p class=\"rp\">However, yarn bombing has landed Polish artist Agata Oleksiak in serious trouble. Agata &ndash; or Olek, as she calls herself &ndash; has been an active artist since 2003, and has covered cars and diggers in wool, as well as a whole train in her native city of &Lstrok;&oacute;d&#378;. Her work has been shown in museums and galleries around the world. But when Olek knitted covers and attached them to sculptures in an underwater museum near Canc&uacute;n, the Mexican authorities were not very happy. Like Jessie Hemmons's jacket, Olek's covers had a political message: she wanted to draw attention to endangered species such as the whale shark. But the director of the museum claims that Olek may herself have harmed the marine life that grows on the sculptures. Olek is puzzled by the reaction. She claims that her message is a positive one and sees herself as a professional artist. She believes that her creations are as good as the paintings you see in the world's best art galleries, and if anyone calls her work 'yarn bombing', she gets quite upset.</p><p class=\"rp\">Whether you see yarn bombing as a bit of fun that brightens up drab cities, or as a form of high culture with a serious message, it is a craze that is likely to continue.</p>", "questions": [{"q": "Jessie Hemmons 'yarn bombed' the statue of Rocky because", "opts": ["she wants people to take photos of it", "she thinks too many tourists come and see it", "she wants more people to go and see the paintings in the museum", "tourists find it annoying"]}, {"q": "Why did Magda Sayeg knit a cover for the door handle of her shop?", "opts": ["for her own amusement", "to attract customers", "because someone passing the shop suggested it", "to set an example to other yarn bombers"]}, {"q": "Jessie thinks that yarn bombing is different from other forms of street art because", "opts": ["its popularity has spread via the internet", "it's temporary and soon disappears", "it looks much nicer", "it's less masculine"]}, {"q": "What is the police's usual attitude to yarn bombing?", "opts": ["They make it clear that it is against the law", "They think that yarn bombers are strange people", "They hardly ever try to arrest yarn bombers", "They tolerate professional artists, but not amateurs"]}, {"q": "Agata Oleksiak isn't very pleased", "opts": ["because she was prevented from knitting covers for objects in a museum", "because people don't realise that she started yarn bombing before anyone else", "if galleries don't accept her work", "if people don't see the difference between her work and yarn bombing"]}, {"q": "What is the writer's overall opinion of yarn bombing?", "opts": ["It is wrong because it's against the law", "The writer doesn't express a personal view", "It's a more feminine version of graffiti", "It deserves to be called 'art'"]}], "answers": ["c", "a", "d", "c", "d", "b"]}, {"id": 8, "title": "A Novel Idea", "source": "Solutions Intermediate - Unit 8", "type": "insertion_tf", "topic": "Literature, media and technology", "skill_name": "Sentence insertion + True/False", "skill_tips": ["Read the whole text first to understand the flow before inserting sentences.", "Look for vocabulary links: the inserted sentence should connect logically with what comes before AND after the gap.", "Pronouns (it, she, they) in the extra sentences must refer back clearly to something already mentioned.", "For True/False: find the exact section of the text that each statement refers to.", "False statements often swap a key fact (year, number, person, location) from the original."], "vocab": [{"word": "instalment", "definition": "one part of a story published or released separately at regular intervals"}, {"word": "pen name / pseudonym", "definition": "a made-up name an author uses instead of their real name"}, {"word": "word of mouth", "definition": "information passed informally from person to person by speaking"}, {"word": "controversial", "definition": "causing disagreement or argument among people"}, {"word": "betray / betrayal", "definition": "to be disloyal to someone who trusts you; an act of disloyalty"}, {"word": "evolve", "definition": "to change and develop gradually over time"}, {"word": "dialogue", "definition": "conversation between characters in a story, film, or play"}, {"word": "literary genre", "definition": "a category or type of literature with shared characteristics"}], "intro_ins": "Read the article. Match sentences A-H with gaps 1-6 in the text. There are two extra sentences.", "intro_tf": "Read the text again. Are the sentences true (T) or false (F)? Write T or F.", "passage": "<p class=\"rp\"><strong>A different type of phone book</strong></p><p class=\"rp\">Although books are still popular with teenagers, most of them spend more of their leisure time staring at their phone than reading a paperback. And the more versatile phones become, the more reasons young people have for looking at them.&nbsp;<span class=\"gm\">[1]</span>&nbsp;Instead of publishing a whole book at once, they produce very short chapters, which they send once a week to their readers by text message. Some even claim that this style of writing represents a new literary genre: the 'cell phone novel'.</p><p class=\"rp\">The very first cell phone novel was written in 2003 by a man in Tokyo who called himself Yoshi.&nbsp;<span class=\"gm\">[2]</span>&nbsp;It became so popular, mainly through word of mouth, that it was later published as a paperback. The book version sold 2.6 million copies and a television series, a comic book and a film were made of the story. Online companies became interested and set up websites where authors could upload their stories and readers could discuss them in forums as the stories evolved.</p><p class=\"rp\">Although the idea originated in Japan, cell phone novels have also sprung up in the rest of East Asia, Europe and Africa. Many are written by high school or university students who are very familiar with the topics that teenagers are interested in.&nbsp;<span class=\"gm\">[3]</span>&nbsp;Twenty-one-year-old Rin said that she started her novel <em>If You</em> during her final year at high school and explained that it was the tragic love story of two childhood friends.</p><p class=\"rp\">Rin wrote her novel over a six-month period in spare moments, often while commuting on the train.&nbsp;<span class=\"gm\">[4]</span>&nbsp;Readers then voted her novel the best that year and she was offered a book contract. Her book sold 400,000 copies and was number five in the Japanese bestseller list. Rin said that her mother had had no idea that she had been writing a novel and was therefore very surprised when she saw a book with her daughter's name on it.</p><p class=\"rp\">The style of cell phone novels has evolved to suit the medium. Chapters have no more than 200 words, and often just 50&ndash;100 words.&nbsp;<span class=\"gm\">[5]</span>&nbsp;The text mostly consists of dialogue and the language is direct, conveying a lot in a few words. Many cell phone novelists had never written fiction before and many of their readers have never read a normal novel. Other rules have evolved; for example, authors only have one name and that is a pseudonym or pen name.</p><p class=\"rp\">In 2009, a young Japanese writer called Takatsu, who lives in Canada, began writing the first English language cell phone novel, <em>Secondhand Memories</em>. Each instalment appeared on textnovel.com, a website dedicated to cell phone stories. Takatsu had read an English translation of Rin's story <em>If You</em> and had been impressed by its simple and emotional language. It was a feature he deliberately copied when he started writing <em>Secondhand Memories</em>.&nbsp;<span class=\"gm\">[6]</span>&nbsp;He now believes that, in English, cell phone novels have a powerful and poetic identity of their own.</p><p class=\"rp\">Takatsu sees himself, and the other writers who contribute to textnovel.com, as part of a literary movement which blends drama, technology, pop culture and social media. Cell phone novels encourage young people to engage in fiction, even those who would not normally pick up a book. They could be described as teen novels for the 21st century.</p>", "sentences": {"A": "Common themes are love, tragedy and betrayal, and the stories often deal with difficult or controversial issues.", "B": "Books are sometimes regarded as old-fashioned and difficult to read.", "C": "In response to this trend, some smart young authors have changed the way they write.", "D": "However, as the story progressed, the style gradually evolved into something different.", "E": "She typed out instalments on her phone and uploaded them onto a popular website for cell phone authors.", "F": "No money is made from cell phone novels unless they are published as books.", "G": "It was called <em>Deep Love</em> and told the story of a teenager who contracted AIDS.", "H": "Sentences are short and there are no descriptions of anything or anybody because there isn't space."}, "answers_ins": ["C", "G", "A", "E", "H", "D"], "extras_ins": ["B", "F"], "tf_statements": ["The first cell phone novel appeared in Japan.", "The success of Yoshi's first book was due mainly to advertisements on the TV and in comic books.", "Most cell phone novels deal with difficult issues.", "Rin did not tell her parents that she was writing a cell phone novel.", "There is a lot of conversation between the characters in cell phone novels.", "Cell phone novels in English have recently appeared in the USA."], "answers_tf": ["T", "F", "T", "T", "T", "F"]}, {"id": 9, "title": "Miscalculations", "source": "Solutions Intermediate - Unit 9", "type": "text_match", "topic": "Science, engineering and famous mistakes", "skill_name": "Matching statements to texts (inference)", "skill_tips": ["Read each text carefully, noting the cause of the problem in each case.", "Statements often use synonyms or paraphrases - don't just look for exact words.", "'Two distinct causes' = look for a text that mentions two separate reasons.", "'Resulted in a loss of life' = look for deaths or casualties in the text.", "One text matches two statements - once identified, check both fit perfectly."], "vocab": [{"word": "rectify", "definition": "to put something right; to correct a mistake"}, {"word": "metric system", "definition": "a decimal system of weights and measures (metres, kilograms, litres)"}, {"word": "imperial units", "definition": "a traditional system of measurement using feet, inches and pounds"}, {"word": "calibrate", "definition": "to adjust or mark a measuring instrument to show accurate readings"}, {"word": "unstable", "definition": "likely to fall or change; not fixed or steady"}, {"word": "orbit (v.)", "definition": "to move in a curved path around a planet or star"}, {"word": "mission", "definition": "an important task or assignment, especially a military or scientific one"}, {"word": "launch (v.)", "definition": "to send a spacecraft, ship or product into action for the first time"}], "intro": "Read the texts (A–D). Match them with statements 1–6 below. Two texts match with two statements.", "passage": "<p class=\"rp\"><strong>A&nbsp; Can't slow down!</strong></p><p class=\"rp\">There were red faces at the headquarters of French train company SNCF in 2014 when they discovered that 2,000 new trains they had ordered were three centimetres too wide for many station platforms. The error appears to have happened because RFF, the company that runs the rail network, gave SNCF the wrong measurements. Instead of measuring all the platforms on the rail network, they only measured platforms that were less than thirty years old. They didn't realise that the gap between platforms built more than fifty years ago is narrower, because trains in those days were a bit slimmer. The new trains cost &euro;15 billion, so there is no question of rebuilding them. It will be cheaper to alter the width of the platforms. But that has so far cost &euro;50 million and the job is not yet finished: there are still 1,000 platforms that need adjusting.</p><p class=\"rp\"><strong>B&nbsp; Too fat to fit!</strong></p><p class=\"rp\">In September 1999, after a trouble-free 286-day journey from Earth, the <em>Mars Climate Orbiter</em> fired its engines in order to slow down and put itself into orbit around Mars. Its mission was to collect information about the Martian climate and try to discover whether there was water on the surface of the red planet. The engines fired successfully, but that was when the problems started. The spacecraft was only sixty kilometres from the planet's surface, instead of 160 kilometres. According to NASA scientists in Florida, the engine quickly overheated, stopped working and was unable to prevent the spacecraft from continuing straight past the planet. It is now probably orbiting the sun. The accident happened because two sets of engineers, one working in metric (millimetres) and the other working with the imperial system (inches), failed to communicate while they were building the spacecraft. It turned out to be an expensive mistake &ndash; the <em>Mars Climate Orbiter</em> cost &pound;125 million!</p><p class=\"rp\"><strong>C&nbsp; Meet you in the middle?</strong></p><p class=\"rp\">What is sea level? Surely it is the same everywhere on Earth? Well, in fact, it isn't, and that is what led to a problem with a bridge being built across a river between Germany and Switzerland in 2004. In Germany, people measure height in relation to the North Sea, while Switzerland chooses to use the Mediterranean, which is 27 centimetres lower. The engineers were fully aware of this difference between the two versions of sea level. However, as the two sides of the bridge came closer to each other, it became clear that they would not meet exactly, as there was a height difference of over half a metre: 54 centimetres, to be precise. Instead of subtracting 27 centimetres, the German engineers had added 27 centimetres. The German side therefore had to be lowered before the bridge could be completed.</p><p class=\"rp\"><strong>D&nbsp; Top heavy!</strong></p><p class=\"rp\">In 1628, the <em>Vasa</em> was the most powerfully armed warship in the world, with 64 enormous cannons. Her Swedish makers were justifiably proud of her. But twenty minutes into her first journey, she was hit by strong winds. She tipped over to the side, water rushed into the ship and she quickly sank, only a mile from the port. Thirty people died. Over the centuries, scientists have tried to explain why the ship was unstable. Most agreed that the top of the ship was far too heavy, but that was not enough to explain why the ship sank. Now, however, scientists at the Vasa Museum, where the ship is displayed, believe they have the answer. They measured every piece of wood in the ship and found that the vessel is asymmetrical and one side of the ship is much heavier than the other. How did this happen? The scientists discovered four rulers that the workman had used. But the rulers used different scales. Two used 'Swedish feet', which were divided into twelve inches, while the others used 'Amsterdam feet', which had eleven inches in each foot. So different carpenters were using different systems of measurement and this led to the wood on one side being thicker than on the other.</p>", "statements": ["This mishap had two distinct causes.", "This mishap was caused because somebody failed to measure something.", "This mishap involved engineers from two countries.", "This mishap was the result of a mistake made in a country outside Europe.", "This mishap resulted in a loss of life.", "This mishap will need even more money to rectify."], "answers": ["D", "A", "C", "B", "D", "A"], "options": ["A", "B", "C", "D"]}];
var cur=0,timer=0,timerRunning=false,timerInterval=null;
var attempts={};
PRACTICES.forEach(function(p){attempts[p.id]=[];});

function startTimer(){
  if(timerRunning)return;
  timerRunning=true;
  timerInterval=setInterval(function(){
    timer++;
    var m=Math.floor(timer/60),s=timer%60;
    document.getElementById('timerChip').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },1000);
}
function pauseTimer(){timerRunning=false;clearInterval(timerInterval);}
document.getElementById('timerChip').addEventListener('click',function(){
  if(timerRunning)pauseTimer();else startTimer();
});

function buildTabs(){
  var row=document.getElementById('tabRow');row.innerHTML='';
  PRACTICES.forEach(function(p,i){
    var d=document.createElement('div');
    d.className='tab'+(i===cur?' active':'');
    var best=getBest(p.id);
    if(best!==null){d.classList.add('done');d.title='Best: '+best.score+'/'+best.total;}
    d.textContent='Practice '+p.id;
    d.onclick=(function(idx){return function(){switchTo(idx);};})(i);
    row.appendChild(d);
  });
}
function getBest(pid){
  var arr=attempts[pid];
  if(!arr||!arr.length)return null;
  return arr.reduce(function(a,b){return a.score>=b.score?a:b;});
}
function switchTo(idx){
  pauseTimer();timer=0;
  document.getElementById('timerChip').textContent='00:00';
  cur=idx;buildTabs();renderPractice();startTimer();
}

function renderSkillBox(p){
  if(!p.skill_name&&!p.skill_tips)return'';
  var h='<div class="skill-box"><div class="skill-title">&#127941; Reading Skill: '+esc(p.skill_name)+'</div>';
  if(p.skill_tips&&p.skill_tips.length){
    h+='<ul class="skill-tips">';
    p.skill_tips.forEach(function(t){h+='<li>'+esc(t)+'</li>';});
    h+='</ul>';
  }
  h+='</div>';
  return h;
}
function renderVocabBox(p){
  if(!p.vocab||!p.vocab.length)return'';
  var h='<div class="vocab-box"><div class="vocab-title">&#128218; Key Vocabulary</div><div class="vocab-grid">';
  p.vocab.forEach(function(v){
    h+='<div class="vocab-item"><div class="vocab-word">'+esc(v.word)+'</div><div class="vocab-def">'+esc(v.definition)+'</div></div>';
  });
  h+='</div></div>';
  return h;
}

function renderPractice(){
  var p=PRACTICES[cur];
  document.getElementById('textPanel').innerHTML=
    '<div class="ptitle">'+p.title+'</div>'+
    (p.topic?'<div class="ptopic">&#128204; '+esc(p.topic)+'</div>':'')+
    '<div class="psrc">'+p.source+'</div>'+
    p.passage;
  var html='';
  var arr=attempts[p.id];
  if(arr.length){
    html+='<div class="attempt-tags">';
    arr.forEach(function(a,i){
      var pct=Math.round(a.score/a.total*100);
      html+='<span class="atag '+(pct>=60?'pass':'fail')+'" onclick="showAttempt('+p.id+','+i+')" title="'+a.ts+'">Attempt '+(i+1)+': '+a.score+'/'+a.total+' ('+pct+'%)</span>';
    });
    html+='</div>';
  }
  html+=renderSkillBox(p);
  html+=renderVocabBox(p);
  html+='<div class="qsec-label">&#9997;&#65039; Comprehension Exercise</div>';
  if(p.type==='insertion')html+=renderInsertion(p);
  else if(p.type==='mcq')html+=renderMCQ(p);
  else if(p.type==='para_match')html+=renderParaMatch(p);
  else if(p.type==='text_match')html+=renderTextMatch(p);
  else if(p.type==='insertion_tf')html+=renderInsertionTF(p);
  html+='<div class="sub-row">'+
    '<button class="sub-btn" onclick="checkAnswers()">&#10003; Check Answers</button>'+
    '<button class="redo-btn" onclick="resetPractice()">&#8635; Try Again</button>'+
    '</div><div id="resultsBox"></div>';
  document.getElementById('qPanel').innerHTML=html;
}

function renderInsertion(p){
  var keys=Object.keys(p.sentences);
  var h='<div class="exbox"><div class="extitle">Sentence Insertion</div><div class="exinstr">'+p.intro+'</div>';
  h+='<div class="sents-box">';
  keys.forEach(function(k){
    h+='<div class="srow"><span class="slabel">'+k+'</span>'+esc(p.sentences[k])+'</div>';
  });
  h+='</div>';
  for(var i=1;i<=p.answers.length;i++){
    h+='<div class="gap-row"><span class="gap-label">Gap ['+i+']</span><select class="gap-sel" id="ins-'+p.id+'-'+i+'"><option value="">-- choose --</option>';
    keys.forEach(function(k){h+='<option value="'+k+'">'+k+' &ndash; '+esc(p.sentences[k].substring(0,55))+'&hellip;</option>';});
    h+='</select></div>';
  }
  h+='</div>';return h;
}

function selectMCQOpt(el){
  var opts=el.closest('.mcq-opts').querySelectorAll('.mcq-opt');
  opts.forEach(function(o){o.classList.remove('selected');});
  el.classList.add('selected');
}
function renderMCQ(p){
  var L=['a','b','c','d'];
  var h='<div class="exbox"><div class="extitle">Multiple Choice</div><div class="exinstr">'+p.intro+'</div>';
  p.questions.forEach(function(q,qi){
    h+='<p class="mcq-q"><span class="mcq-qnum">'+(qi+1)+'</span>'+esc(q.q)+'</p><div class="mcq-opts">';
    q.opts.forEach(function(o,oi){
      h+='<label class="mcq-opt" onclick="selectMCQOpt(this)"><input type="radio" name="mcq-'+p.id+'-'+qi+'" value="'+L[oi]+'"><span class="mcq-optlabel">'+L[oi]+'</span><span>'+esc(o)+'</span></label>';
    });
    h+='</div>';
  });
  h+='</div>';return h;
}

function renderParaMatch(p){
  var letters=[];
  ['A','B','C','D','E','F','G','H'].forEach(function(l){
    if(p.passage.indexOf('>'+l+'&')>=0||p.passage.indexOf('>'+l+'<')>=0||p.passage.indexOf('>'+l+' ')>=0)letters.push(l);
  });
  var h='<div class="exbox"><div class="extitle">Paragraph Matching</div><div class="exinstr">'+p.intro+'</div>';
  if(p.note)h+='<div style="font-size:.82rem;color:#888;margin-bottom:10px;padding:6px 10px;background:#fffbf0;border-radius:5px;border-left:3px solid #f0c040">&#9888; '+p.note+'</div>';
  p.questions.forEach(function(q,qi){
    h+='<div class="match-row"><span class="match-num">'+(qi+1)+'</span><span class="match-text"><em>'+esc(p.passage_label)+'</em> '+esc(q)+'</span><select class="match-sel" id="pm-'+p.id+'-'+qi+'"><option value="">--</option>';
    letters.forEach(function(l){h+='<option value="'+l+'">'+l+'</option>';});
    h+='</select></div>';
  });
  h+='</div>';return h;
}

function renderTextMatch(p){
  var h='<div class="exbox"><div class="extitle">Text Matching</div><div class="exinstr">'+p.intro+'</div>';
  if(p.note)h+='<div style="font-size:.82rem;color:#888;margin-bottom:10px;padding:6px 10px;background:#fffbf0;border-radius:5px;border-left:3px solid #f0c040">&#9888; '+p.note+'</div>';
  p.statements.forEach(function(st,si){
    h+='<div class="match-row"><span class="match-num">'+(si+1)+'</span><span class="match-text">'+esc(st)+'</span><select class="match-sel" id="tm-'+p.id+'-'+si+'"><option value="">--</option>';
    p.options.forEach(function(o){h+='<option value="'+o+'">'+o+'</option>';});
    h+='</select></div>';
  });
  h+='</div>';return h;
}

function renderInsertionTF(p){
  var keys=Object.keys(p.sentences);

    h+='<div class="srow"><span class="slabel">'+k+'</span>'+esc(p.sentences[k])+'</div>';
  });
  h+='</div>';
  for(var i=1;i<=p.answers_ins.length;i++){
    h+='<div class="gap-row"><span class="gap-label">Gap ['+i+']</span><select class="gap-sel" id="ins-'+p.id+'-'+i+'"><option value="">-- choose --</option>';
    keys.forEach(function(k){h+='<option value="'+k+'">'+k+' &ndash; '+esc(p.sentences[k].substring(0,55))+'&hellip;</option>';});
    h+='</select></div>';
  }
  h+='</div>';
  h+='<div class="exbox"><div class="extitle">Part B: True or False</div><div class="exinstr">'+p.intro_tf+'</div>';

  h+='</div>';return h;

function selTF(pid,idx,val){
  var other=val==='T'?'F':'T';
  var btn=document.getElementById('tf-'+pid+'-'+idx+'-'+val);
  var obtn=document.getElementById('tf-'+pid+'-'+idx+'-'+other);
  if(btn.classList.contains('sel-'+val)){btn.classList.remove('sel-'+val);}
  else{btn.classList.add('sel-'+val);obtn.classList.remove('sel-'+other);}
}

function checkAnswers(){
  var p=PRACTICES[cur];var results=[];var score=0,total=0;
  if(p.type==='insertion'){
    for(var i=1;i<=p.answers.length;i++){
      var sel=document.getElementById('ins-'+p.id+'-'+i);
      var u=sel?sel.value:'',c=p.answers[i-1],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Gap ['+i+']',user:u||'(blank)',correct:c,ok:ok});
    }
  }else if(p.type==='mcq'){
    p.questions.forEach(function(q,qi){
      var radios=document.querySelectorAll('input[name="mcq-'+p.id+'-'+qi+'"]');
      var u='';radios.forEach(function(r){if(r.checked)u=r.value;});
      var c=p.answers[qi],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Q'+(qi+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(q.q.substring(0,55))+'...'});
    });
  }else if(p.type==='para_match'){
    p.questions.forEach(function(q,qi){
      var sel=document.getElementById('pm-'+p.id+'-'+qi);
      var u=sel?sel.value:'',c=p.answers[qi],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Q'+(qi+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(q.substring(0,55))+'...'});
    });
  }else if(p.type==='text_match'){
    p.statements.forEach(function(st,si){
      var sel=document.getElementById('tm-'+p.id+'-'+si);
      var u=sel?sel.value:'',c=p.answers[si],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Statement '+(si+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(st.substring(0,55))+'...'});
    });
  }else if(p.type==='insertion_tf'){
    for(var i=1;i<=p.answers_ins.length;i++){
      var sel=document.getElementById('ins-'+p.id+'-'+i);
      var u=sel?sel.value:'',c=p.answers_ins[i-1],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'Gap ['+i+']',user:u||'(blank)',correct:c,ok:ok});
    }
    p.tf_statements.forEach(function(st,si){
      var tB=document.getElementById('tf-'+p.id+'-'+si+'-T');
      var fB=document.getElementById('tf-'+p.id+'-'+si+'-F');
      var u=tB&&tB.classList.contains('sel-T')?'T':fB&&fB.classList.contains('sel-F')?'F':'';
      var c=p.answers_tf[si],ok=u===c;
      if(ok)score++;total++;
      results.push({label:'TF '+(si+1),user:u||'(blank)',correct:c,ok:ok,qtext:esc(st.substring(0,55))+'...'});
    });
  }
  var pct=Math.round(score/total*100);
  var now=new Date();
  var ts=now.toLocaleTimeString();
  var dateStr=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  var userName=document.getElementById('userName').value.trim()||'(not entered)';
  var userEmail=document.getElementById('userEmail').value.trim()||'(not entered)';
  attempts[p.id].push({score:score,total:total,pct:pct,ts:ts,results:results,name:userName,email:userEmail});
  buildTabs();
  var h='<div class="report-card">'+
    '<div class="report-header">'+
      '<div>'+
        '<div class="report-user">&#128100; '+esc(userName)+'</div>'+
        '<div class="report-meta">&#9993; '+esc(userEmail)+'&nbsp;&nbsp;|&nbsp;&nbsp;&#128204; '+esc(p.source)+'</div>'+
      '</div>'+
      '<div class="report-stamp">'+dateStr+'<br>'+ts+'</div>'+
    '</div>'+
    '<div class="score-box" style="margin-bottom:0">'+
      '<div class="score-item"><div class="score-val">'+score+'/'+total+'</div><div class="score-lbl">Score</div></div>'+
      '<div class="score-item"><div class="score-val">'+pct+'%</div><div class="score-lbl">Percent</div></div>'+
      '<div class="score-item"><div class="score-val">'+(pct>=60?'&#10003; Pass':'&#10007; Fail')+'</div><div class="score-lbl">Result</div></div>'+
    '</div>'+
  '</div>';
  h+='<div class="res-banner '+(pct>=60?'res-pass':'res-fail')+'">'+(pct>=60?'&#10003; Well done! '+pct+'% correct.':'&#10007; Keep practising. '+pct+'% correct.')+' ('+score+'/'+total+')</div>';
  results.forEach(function(r){
    h+='<div class="q-result"><div class="q-rh '+(r.ok?'correct':'wrong')+'">'+
      '<span>'+(r.ok?'&#10003;':'&#10007;')+' '+r.label+(r.qtext?' &mdash; <span style="font-weight:400;font-size:.8rem">'+r.qtext+'</span>':'')+'</span>'+
      '<span class="ans-lbl">Yours: <strong>'+r.user+'</strong> | Correct: <strong>'+r.correct+'</strong></span>'+
      '</div></div>';
  });
  document.getElementById('resultsBox').innerHTML=h;
  document.getElementById('resultsBox').scrollIntoView({behavior:'smooth',block:'start'});
}

    var arr=attempts[p.id]||[];
    h+='<div class="pr-card">';
    h+='<div class="pr-card-title">Practice '+p.id+': '+esc(p.title)+' <span style="font-weight:400;font-size:.82rem;color:#666">('+esc(p.source)+') &mdash; '+arr.length+' attempt'+(arr.length!==1?'s':'')+'</span></div>';
    if(arr.length===0){
      h+='<div class="pr-no-attempt">No attempts yet.</div>';
    }else{
      arr.forEach(function(a,i){
        var cls=a.pct>=60?'pr-pass':'pr-fail';
        h+='<div class="pr-attempt"><span class="'+cls+'">Attempt '+(i+1)+': <strong>'+a.score+'/'+a.total+' ('+a.pct+'%)</strong> &mdash; '+(a.pct>=60?'PASS':'FAIL')+'</span>';
        h+=' &nbsp;&mdash;&nbsp; '+a.ts;
        h+='</div>';
      });
    }
    h+='</div>';
  });
  h+='<div class="pr-footer">HUONG STELLA PARADIGM &mdash; Reading Practice Level 3 &mdash; Generated '+dateStr+'</div>';
  h+='</div>';
  var old=document.getElementById('printReport');
  if(old)old.remove();
  var div=document.createElement('div');
  div.innerHTML=h;
  document.getElementById('textPanel').appendChild(div.firstChild);
  window.print();
}

  var now=new Date();
  var dateStr=now.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  var body='READING PRACTICE RESULTS - HUONG STELLA PARADIGM\n';
  body+='==========================================\n';
  body+='Student: '+userName+'\n';
  body+='Email: '+userEmail+'\n';
  body+='Date: '+dateStr+'\n\n';
  var totalScore=0,totalMax=0,anyAttempt=false;
  PRACTICES.forEach(function(p){
    var arr=attempts[p.id]||[];
    body+='Practice '+p.id+': '+p.title+'\n';

      body+='  (no attempts)\n';

      arr.forEach(function(a,i){
        body+='  Attempt '+(i+1)+': '+a.score+'/'+a.total+' ('+a.pct+'%) - '+(a.pct>=60?'PASS':'FAIL')+' ['+a.ts+']\n';

      var best=arr.reduce(function(a,b){return a.score>=b.score?a:b;});
      body+='  Best: '+best.score+'/'+best.total+' ('+best.pct+'%)\n';

    body+='\n';
  });
  if(anyAttempt&&totalMax>0){
    body+='==========================================\n';

  var subject=encodeURIComponent('Reading Practice Results - '+userName+' - '+dateStr);
  var bodyEnc=encodeURIComponent(body);
  window.location.href='mailto:huongstella8@gmail.com?subject='+subject+'&body='+bodyEnc;
}
function esc(s){
  if(!s)return'';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
