name": "Negative Descriptions", "words": [{"w": "crowded", "vi": "đông đúc", "ex": "crowded beaches"}, {"w": "overpriced", "vi": "đắt quá mức", "ex": "overpriced hotels"}, {"w": "touristy", "vi": "quá thương mại du lịch", "ex": "a touristy area"}, {"w": "exhausting", "vi": "mệt lử", "ex": "an exhausting journey"}, {"w": "bumpy", "vi": "xóc nảy, gập ghềnh", "ex": "a bumpy ride"}, {"w": "cramped", "vi": "chật chội", "ex": "cramped economy seats"}, {"w": "delayed", "vi": "bị trễ", "ex": "a delayed flight"}, {"w": "remote", "vi": "hẻo lánh, xa xôi", "ex": "a remote village"}, {"w": "inaccessible", "vi": "khó tiếp cận", "ex": "inaccessible by road"}, {"w": "chaotic", "vi": "hỗn loạn", "ex": "chaotic traffic"}]}]}, {"letter": "I", "title": "Idioms & Collocations", "sub": "Travel idioms · collocations", "groups": [{"name": "Travel Idioms", "words": [{"w": "hit the road", "vi": "lên đường, khởi hành", "ex": "time to hit the road"}, {"w": "off the beaten track", "vi": "nơi vắng khách du lịch", "ex": "a village off the beaten track"}, {"w": "travel light", "vi": "đi du lịch gọn nhẹ", "ex": "I always travel light"}, {"w": "the journey of a lifetime", "vi": "chuyến đi để đời", "ex": "the journey of a lifetime"}, {"w": "live out of a suitcase", "vi": "sống nay đây mai đó", "ex": "live out of a suitcase"}, {"w": "catch the travel bug", "vi": "mê du lịch, nghiện đi", "ex": "she caught the travel bug"}, {"w": "a stone's throw away", "vi": "rất gần", "ex": "the beach is a stone's throw away"}, {"w": "get itchy feet", "vi": "muốn đi đây đó", "ex": "I'm getting itchy feet"}, {"w": "miss the boat", "vi": "lỡ cơ hội", "ex": "don't miss the boat"}, {"w": "in the same boat", "vi": "cùng cảnh ngộ", "ex": "we're all in the same boat"}, {"w": "a bumpy ride", "vi": "giai đoạn khó khăn", "ex": "expect a bumpy ride"}, {"w": "wish you were here", "vi": "ước gì bạn ở đây (bưu thiếp)", "ex": "'Wish you were here!'"}]}, {"name": "Common Collocations", "words": [{"w": "go on holiday", "vi": "đi nghỉ const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
TOPICS.forEach(t=>{t.total=0;t.data.forEach(m=>m.groups.forEach(g=>t.total+=g.words.length));});
const GRAND=TOPICS.reduce((s,t)=>s+t.total,0);
$('headsub').textContent=`${TOPICS.length} chủ đề · ${GRAND} từ vựng · bấm chủ đề để học · 🔊 phát âm Anh–Anh · 🎮 quiz`;
$('foot').innerHTML='HUONG STELLA · POLARIS Vocabulary Hubs — bấm tiêu đề để về trang chủ. Phát âm dùng giọng Anh–Anh của trình duyệt.';

/* British voice */
let voice=null;
function pick(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const pref=["Google UK English Female","Microsoft Sonia Online (Natural) - English (United Kingdom)","Microsoft Libby Online (Natural) - English (United Kingdom)","Kate","Serena","Daniel"];
  for(const n of pref){const v=vs.find(x=>x.name===n);if(v)return v;}
  return vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/United Kingdom/i.test(v.name))||null;}
if('speechSynthesis' in window){voice=pick();speechSynthesis.onvoiceschanged=()=>{voice=pick();};}
function say(w){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.9;u.pitch=1.05;if(!voice)voice=pick();if(voice)u.voice=voice;speechSynthesis.cancel();speechSynthesis.speak(u);}

const tabsEl=$('tabs'), mainEl=$('main');
let cur={topic:null, tab:'all'};

function card(e, withTopic){
  return `<div class="card"><div class="w">${withTopic?`<span class="tp">${esc(withTopic)}</span>`:''}<span>${esc(e.w)}</span>
    <button class="spk" title="Nghe" onclick="say('${String(e.w).replace(/'/g,"\\'")}')">🔊</button></div>
    <div class="vi">${esc(e.vi)}</div><div class="ex">e.g. ${esc(e.ex)}</div></div>`;
}
function groupHTML(g){return `<div class="sub">${esc(g.name)} <span class="cnt">· ${g.words.length}</span></div><div class="grid">${g.words.map(e=>card(e)).join('')}</div>`;}

/* ---------- HOME ---------- */
function goHome(){cur={topic:null,tab:'all'};renderTabs();renderHome();window.scrollTo({top:0,behavior:'smooth'});}
function renderHome(){
  const cards=TOPICS.map(t=>`<div class="tcard" onclick="openTopic('${t.key}')">
     <div class="ico" style="background:${t.color}">${t.icon}</div>
     <div><h3>${esc(t.name)}</h3><div class="meta">${t.data.length} module · ${t.total} từ</div></div></div>`).join('');
  mainEl.innerHTML=`<div class="searchbar"><span class="ic">🔎</span>
     <input id="q" placeholder="Tìm từ trong TẤT CẢ chủ đề… (VD: budget, đồng nghiệp, on cloud nine)" oninput="globalSearch(this.value)"></div>
     <div id="results"><div class="topicgrid">${cards}</div></div>`;
}
function globalSearch(v){
  const q=(v||'').toLowerCase().trim(); const box=$('results');
  if(!q){box.innerHTML=`<div class="topicgrid">${TOPICS.map(t=>`<div class="tcard" onclick="openTopic('${t.key}')"><div class="ico" style="background:${t.color}">${t.icon}</div><div><h3>${esc(t.name)}</h3><div class="meta">${t.data.length} module · ${t.total} từ</div></div></div>`).join('')}</div>`;return;}
  let html='',shown=0;
  TOPICS.forEach(t=>{
    const hits=[];
    t.data.forEach(m=>m.groups.forEach(g=>g.words.forEach(e=>{ if((e.w+' '+e.vi+' '+e.ex).toLowerCase().includes(q)) hits.push(e); })));
    if(hits.length){shown+=hits.length; html+=`<div class="sub" style="cursor:pointer" onclick="openTopic('${t.key}')">${t.icon} ${esc(t.name)} <span class="cnt">· ${hits.length}</span></div><div class="grid">${hits.map(e=>card(e,t.short)).join('')}</div>`;}
  });
  box.innerHTML= shown? html : `<div class="empty">Không tìm thấy “${esc(q)}” trong chủ đề nào.</div>`;
}

/* ---------- TOPIC ---------- */
function openTopic(key){cur={topic:key,tab:'all'};renderTabs();renderTopicBody();window.scrollTo({top:0,behavior:'smooth'});}
function renderTabs(){
  tabsEl.innerHTML='';
  if(!cur.topic){ tabsEl.innerHTML=`<span class="navtitle">📚 Tất cả chủ đề</span>`; return; }
  const t=TOPICS.find(x=>x.key===cur.topic);
  const mk=(id,label,cls)=>{const b=document.createElement('button');b.className=(cls||'')+(cur.tab===id?' active':'');b.innerHTML=label;b.onclick=()=>{cur.tab=id;renderTabs();renderTopicBody();window.scrollTo({top:0,behavior:'smooth'});};return b;};
  const back=document.createElement('button');back.className='back';back.innerHTML='← Chủ đề';back.onclick=goHome;tabsEl.appendChild(back);
  const title=document.createElement('span');title.className='navtitle';title.innerHTML=`${t.icon} ${esc(t.name)}`;tabsEl.appendChild(title);
  tabsEl.appendChild(mk('all','🔎 Tất cả'));
  t.data.forEach(m=>tabsEl.appendChild(mk('m'+m.letter,`<span style="font-family:var(--fh);font-weight:700;color:var(--orange)">${m.letter}</span>`)));
  tabsEl.appendChild(mk('quiz','🎮 Quiz'));
}
function renderTopicBody(){
  const t=TOPICS.find(x=>x.key===cur.topic);
  if(cur.tab==='quiz'){renderQuiz(t);return;}
  if(cur.tab==='all'){
    mainEl.innerHTML=`<div class="modhead"><div class="badge" style="background:linear-gradient(150deg,${t.color},#00000022)">${t.icon}</div><div><h2>${esc(t.name)}</h2><p>${t.data.length} module · ${t.total} từ</p></div></div>
      <div class="searchbar"><span class="ic">🔎</span><input id="q" placeholder="Tìm trong ${esc(t.name)}…" oninput="topicSearch(this.value)"></div><div id="results"></div>`;
    topicSearch('');return;
  }
  const m=t.data.find(x=>'m'+x.letter===cur.tab);
  mainEl.innerHTML=`<div class="modhead"><div class="badge">${m.letter}</div><div><h2>${esc(m.title)}</h2><p>${esc(m.sub)}</p></div></div>`+m.groups.map(groupHTML).join('');
}
function topicSearch(v){
  const t=TOPICS.find(x=>x.key===cur.topic); const q=(v||'').toLowerCase().trim(); const box=$('results'); if(!box)return;
  let html='',shown=0;
  t.data.forEach(m=>{
    let inner='';
    m.groups.forEach(g=>{const ws=g.words.filter(e=>!q||(e.w+' '+e.vi+' '+e.ex).toLowerCase().includes(q));
      if(ws.length){shown+=ws.length;inner+=`<div class="sub">${esc(g.name)} <span class="cnt">· ${ws.length}</span></div><div class="grid">${ws.map(e=>card(e)).join('')}</div>`;}});
    if(inner)html+=`<div class="modhead" style="margin-top:22px"><div class="badge">${m.letter}</div><div><h2>${esc(m.title)}</h2></div></div>`+inner;
  });
  box.innerHTML= shown? html : `<div class="empty">Không tìm thấy “${esc(q)}”.</div>`;
}

/* ---------- QUIZ ---------- */
let quiz={pool:[],i:0,score:0,answered:false,topic:null};
function topicWords(t){const a=[];t.data.forEach(m=>m.groups.forEach(g=>g.words.forEach(w=>a.push(w))));return a;}
function renderQuiz(t){
  mainEl.innerHTML=`<div class="quizwrap"><div class="qctrl" style="justify-content:center;margin:0 0 16px">
     <span class="navtitle">${t.icon} ${esc(t.name)} — Quiz</span>
     <button class="btn p" onclick="startQuiz('${t.key}')">Bắt đầu / Làm lại</button></div><div id="qbody"></div></div>`;
  startQuiz(t.key);
}
function startQuiz(key){
  const t=TOPICS.find(x=>x.key===key); quiz.allWords=topicWords(t);
  quiz={allWords:quiz.allWords, pool:quiz.allWords.slice().sort(()=>Math.random()-.5).slice(0,10), i:0, score:0, answered:false, topic:key};
  drawQ();
}
function drawQ(){
  const body=$('qbody'); const q=quiz.pool[quiz.i];
  if(!q){body.innerHTML=`<div class="qcard"><div class="qprompt-label">Kết quả</div><div class="qprompt">${quiz.score}/${quiz.pool.length}</div><div class="qctrl"><button class="btn p" onclick="startQuiz('${quiz.topic}')">↻ Làm lại</button></div></div>`;return;}
  const others=quiz.allWords.filter(w=>w.w!==q.w).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.w);
  const opts=[q.w,...others].sort(()=>Math.random()-.5); quiz.answered=false;
  body.innerHTML=`<div class="qcard"><div class="qtop"><span>Câu ${quiz.i+1}/${quiz.pool.length}</span><span class="score">⭐ ${quiz.score}</span></div>
    <div class="qprompt-label">How do you say it in English?</div><div class="qprompt">${esc(q.vi)}</div>
    <div class="qopts" id="qopts">${opts.map((o,i)=>`<button data-o="${encodeURIComponent(o)}" onclick="answer(this)"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="qreveal" id="qreveal"></div><div class="qctrl"><button class="btn g" id="qnext" onclick="nextQ()" style="display:none">Câu tiếp →</button></div></div>`;
}
function answer(btn){
  if(quiz.answered)return;quiz.answered=true;const q=quiz.pool[quiz.i];const chosen=decodeURIComponent(btn.dataset.o);
  document.querySelectorAll('#qopts button').forEach(b=>{const o=decodeURIComponent(b.dataset.o);b.disabled=true;if(o===q.w)b.classList.add('correct');else if(o===chosen)b.classList.add('wrong');});
  if(chosen===q.w)quiz.score++; say(q.w); $('qreveal').innerHTML=`<b>${esc(q.w)}</b> — ${esc(q.ex)}`; $('qnext').style.display='inline-block';
}
function nextQ(){quiz.i++;drawQ();}

goHome();
</script>
